<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memento · Motion</title>
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<style>
  :root { --paper: #eee9de; --ink: #2b211f; --line: #cfc6b4; --accent: #c8483a; --loops: #3f5fae; --mm: #c8483a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font: 13px/1.35 system-ui, sans-serif; }
  body { display: flex; overflow: hidden; }
  #panel { width: 350px; flex: none; height: 100%; overflow-y: auto; border-right: 1px solid var(--line); background: #f6f2e8; padding: 8px 10px 40px; }
  #panel h1 { font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase; margin: 4px 0 2px; }
  #panel h1 a { color: inherit; text-decoration: none; }
  #panel .sub { margin: 0 0 8px; opacity: 0.7; font-size: 12px; }
  #panel .sub a { color: inherit; }
  details { border-top: 1px solid var(--line); padding: 4px 0; }
  summary { cursor: pointer; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; font-size: 11.5px; padding: 4px 0; user-select: none; }
  .row { display: grid; grid-template-columns: 96px 1fr auto; align-items: center; gap: 6px; margin: 3px 0; min-height: 24px; }
  .row label { font-size: 12px; opacity: 0.85; }
  .row output { font-variant-numeric: tabular-nums; font-size: 11px; min-width: 34px; text-align: right; opacity: 0.75; }
  .row[hidden], [hidden] { display: none !important; }
  select, input, button { font: inherit; color: inherit; }
  select { width: 100%; padding: 2px 4px; background: #fffdf8; border: 1px solid var(--line); border-radius: 4px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); justify-self: start; }
  button { background: #fffdf8; border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button.on { border-color: var(--ink); font-weight: 600; background: #fff; }
  .buttons { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
  .seg { display: flex; gap: 0; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 4px 4px 0; }
  table.nums { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 12px; margin: 4px 0; }
  table.nums th, table.nums td { text-align: right; padding: 1px 4px; border-bottom: 1px solid #e6dfd0; }
  table.nums th:first-child, table.nums td:first-child { text-align: left; opacity: 0.8; font-weight: normal; }
  table.nums td.win { font-weight: 700; }
  .loops { color: var(--loops); } .mm { color: var(--mm); }
  .note { font-size: 11.5px; opacity: 0.7; margin: 3px 0; }
  .kv { display: grid; grid-template-columns: 96px 1fr; gap: 1px 6px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .kv span:nth-child(odd) { opacity: 0.75; }
  ul.clips { list-style: none; margin: 4px 0; padding: 0; max-height: 260px; overflow-y: auto; font-size: 11.5px; border: 1px solid #e6dfd0; border-radius: 4px; background: #fffdf8; }
  ul.clips li { padding: 1px 6px; display: flex; justify-content: space-between; gap: 6px; }
  ul.clips li.group { font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; font-size: 10.5px; background: #f1ebde; }
  ul.clips li.playing { background: #f7d9d2; font-weight: 600; }
  ul.clips li small { opacity: 0.65; white-space: nowrap; }
  .walker { display: grid; grid-template-columns: 1fr 74px 30px 22px; gap: 4px; align-items: center; margin: 3px 0; }
  .walker output { font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }
  .walker small { grid-column: 1 / -1; opacity: 0.7; font-size: 11px; font-variant-numeric: tabular-nums; margin-top: -2px; }
  #view { position: relative; flex: 1; height: 100%; min-width: 0; touch-action: none; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  #status { position: absolute; left: 10px; bottom: 8px; padding: 3px 8px; background: rgba(246, 242, 232, 0.85); border-radius: 4px; font-size: 12px; pointer-events: none; max-width: calc(100% - 20px); }
  #transport { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  #transport button { background: rgba(255, 253, 248, 0.9); }
  .balloon { display: none !important; }
  @media (max-width: 760px), (max-width: 1000px) and (orientation: portrait) {
    body { flex-direction: column; }
    #panel { width: 100%; height: 45%; border-right: 0; border-bottom: 1px solid var(--line); order: 2; }
    #view { height: 55%; flex: none; order: 1; }
  }
</style>
</head>
<body>
<aside id="panel">
  <h1><a href="./index.html" title="Back to the game">Memento</a> · Motion</h1>
  <p class="sub">The traveller's two ways of moving, side by side: the blended loops (the game's default) and motion matching over the captured takes; and the people's walks. Drawn by the game's own ink pass. <a href="./studio.html">Character studio</a></p>
  <div id="controls"></div>
</aside>
<main id="view">
  <canvas id="overlay"></canvas>
  <div id="transport"></div>
  <output id="status">Loading the travellers…</output>
</main>
<script type="module" src="/src/motion/main.js"></script>
</body>
</html>
