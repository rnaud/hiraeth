<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6f9fd3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hiraeth" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <title>Hiraeth</title>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f7ecd2; }
      canvas { display: block; touch-action: none; }
      /* Nothing on the screen at rest (src/hud.js). The cue: one short line at the bottom, only for
         what the use button does right here with nothing to float over, a ride's controls for a few
         seconds, a region's name as you cross into it; it fades in and out */
      #cue {
        position: fixed; left: 50%; bottom: calc(22px + var(--safe-bottom, 0px)); z-index: 31; transform: translateX(-50%);
        width: max-content; max-width: min(720px, calc(100vw - 32px)); box-sizing: border-box; text-align: center;
        font: 12px/1.5 ui-monospace, Menlo, monospace; color: #2b211f; background: rgba(255, 250, 240, 0.9);
        border: 1.5px solid #2b211f; border-radius: 14px; box-shadow: 2px 2px 0 #2b211f; padding: 3px 12px;
        pointer-events: none; user-select: none; opacity: 0; transition: opacity 0.35s;
      }
      #cue.show { opacity: 1; }
      #cue .key { font-size: 0.9em; min-width: 1.7em; height: 1.7em; margin: -2px 1px 0 0; }
      /* a region's name: thin capitals on the land, no box */
      #cue.place { background: none; border: 0; box-shadow: none; padding: 0; transition: opacity 0.9s;
        font: 300 clamp(13px, 2.4vh, 19px)/1.2 'Avenir Next', Futura, 'Futura PT', 'Helvetica Neue', Roboto, sans-serif;
        letter-spacing: 0.32em; text-transform: uppercase; text-shadow: 0 0 2px #fffaf0, 0 0 6px #fffaf0, 0 0 14px rgba(255, 250, 240, 0.95); }
      /* the scout's find: the quest's goal, small, over its next step (src/hud.js findSummary) */
      #cue.quest { padding: 4px 16px 5px; border-radius: 12px; }
      #cue.quest .goal { display: block; font: italic 500 clamp(10px, 1.7vh, 12px)/1.3 'Avenir Next', Futura, 'Helvetica Neue', Roboto, sans-serif; letter-spacing: 0.06em; opacity: 0.75; }
      #cue.quest .step { display: block; font-weight: bold; }
      body.talking #cue, body.cine-on #cue { visibility: hidden; }
      /* health: a small inked bar, only while you're hurt (src/main.js) */
      #health { position: fixed; left: calc(16px + var(--safe-left, 0px)); top: calc(14px + var(--safe-top, 0px)); width: 150px; height: 11px; z-index: 30;
        border: 2px solid #2b211f; background: #f7ecd2; box-shadow: 2px 2px 0 #2b211f; border-radius: 6px; overflow: hidden;
        opacity: 0; transition: opacity .5s; pointer-events: none; }
      #health.on { opacity: 1; }
      #health i { display: block; height: 100%; width: 100%; background: #d9503f; border-right: 2px solid #2b211f; transition: width .25s; }
      #health.low i { animation: hpulse .8s ease-in-out infinite; }
      @keyframes hpulse { 50% { background: #f2c54b; } }
      body.talking #health { opacity: 0; }
      /* stamina: a small inked wheel beside the traveller, only while it isn't full (src/main.js updateStamina, src/stamina.js) */
      #stamina { position: fixed; left: 0; top: 0; width: 34px; height: 34px; z-index: 29; pointer-events: none; opacity: 0; transition: opacity .35s;
        will-change: transform; }
      #stamina.on { opacity: 1; }
      #stamina svg { display: block; width: 100%; height: 100%; overflow: visible; transform: rotate(-4deg); }
      #stamina .arc { fill: none; stroke: #3f8f6a; stroke-width: 7.5; transition: stroke .3s; }
      #stamina.winded .arc { stroke: #c8483a; animation: stpulse .7s ease-in-out infinite; }
      @keyframes stpulse { 50% { stroke: #f2c54b; } }
      body.talking #stamina { opacity: 0; }
      /* knocked out (a fatal fall): the screen dims and asks to restart (src/main.js) */
      #restart { position: fixed; inset: 0; z-index: 85; display: grid; place-items: start center; padding-top: 16vh; background: rgba(43, 33, 31, 0.6);
        opacity: 0; visibility: hidden; transition: opacity .9s, visibility 0s .9s; }
      #restart.open { opacity: 1; visibility: visible; transition: opacity .9s; }
      #restart .sheet { padding: 18px 26px 14px; background: #f7ecd2; border: 2px solid #2b211f; box-shadow: 6px 6px 0 #2b211f; transform: rotate(-0.8deg);
        font: 13px/1.5 ui-monospace, Menlo, monospace; color: #2b211f; text-align: center; min-width: 220px; }
      #restart p { margin: 0 0 12px; letter-spacing: 0.04em; }
      #restart button { font: 700 16px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.14em; color: #2b211f; background: #f2c54b;
        border: 2px solid #2b211f; box-shadow: 3px 3px 0 #2b211f; padding: 10px 22px; cursor: pointer; border-radius: 4px; }
      #restart button:focus-visible, #restart button:hover { background: #ffd866; outline: none; }
      #restart button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #2b211f; }
      #restart small { display: block; margin-top: 10px; color: #6b5a4e; font-size: 11px; }
      #picker {
        position: fixed; inset: 0; z-index: 5000; display: none; overflow: auto;
        background: rgba(247, 236, 210, 0.94); color: #2b211f;
        font: 13px/1.45 ui-monospace, Menlo, monospace; padding: 40px 48px;
      }
      #picker.open { display: block; }
      #picker header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; }
      #picker h1 { font-size: 26px; letter-spacing: 0.12em; margin: 0; }
      #picker header span { opacity: 0.7; }
      #picker .close { border: 1.5px solid #2b211f; background: none; font: inherit; padding: 4px 10px; cursor: pointer; }
      #picker .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); gap: 22px; }
      #picker .card {
        display: flex; align-items: stretch; color: inherit; text-decoration: none; background: #fbf4e2;
        border: 2px solid #2b211f; box-shadow: 5px 5px 0 #2b211f; transition: transform 0.12s;
      }
      #picker .card:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 #2b211f; }
      #picker .card.current { outline: 3px solid #d9643a; outline-offset: 3px; }
      #picker img { display: block; flex: none; align-self: flex-start; width: 96px; height: 96px; margin: 12px 0 12px 12px; object-fit: cover; border: 2px solid #2b211f; background: #efe3c6; }
      #picker .txt { flex: 1; min-width: 0; padding: 12px 14px 14px; position: relative; }
      #picker .num { position: absolute; right: 14px; top: 10px; font-size: 22px; opacity: 0.35; }
      #picker h2 { margin: 0 0 2px; padding-right: 30px; font-size: 17px; letter-spacing: 0.05em; }
      #picker .src { font-style: italic; opacity: 0.75; margin-bottom: 8px; }
      #picker p { margin: 0 0 10px; }
      #picker .moves { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #8a5a3c; }
      #photo {
        position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: none;
        font: 12px ui-monospace, Menlo, monospace; color: #2b211f; background: rgba(247, 236, 210, 0.8);
        border: 1.5px solid #2b211f; padding: 6px 12px; pointer-events: none; animation: fadehint 4s forwards;
      }
      #photo.open { display: block; }
      @keyframes fadehint { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
      #fps { position: fixed; right: 64px; bottom: 22px; z-index: 30; font: 12px ui-monospace, Menlo, monospace; color: #2b211f;
        background: rgba(255, 250, 240, 0.8); border: 1.5px solid #2b211f; padding: 3px 7px; pointer-events: none; }
      #fps:empty, body.nofps #fps { display: none; }
      body.touch #fps { top: 22px; bottom: auto; right: 64px; }
      /* the menu's button: only on a touch screen (keyboard: O / Esc, a pad: Menu), small and faint in the corner */
      #gear {
        position: fixed; right: 14px; bottom: 14px; z-index: 30; width: 30px; height: 30px; padding: 0; font-size: 17px; line-height: 1;
        background: rgba(255, 250, 240, 0.35); color: #2b211f; border: 1.5px solid rgba(43, 33, 31, 0.45); border-radius: 50%; cursor: pointer;
        opacity: 0.45; transition: opacity 0.2s;
      }
      #gear:active, #gear:focus-visible { opacity: 1; }
      body:not(.touch) #gear { display: none; }
      #changelog { position: fixed; inset: 0; z-index: 8700; display: none; place-items: center; background: rgba(43, 33, 31, 0.45); }
      #changelog.open { display: grid; }
      #changelog .panel {
        width: min(620px, 94vw); max-height: 86vh; display: flex; flex-direction: column; padding: 20px 24px; background: #f7ecd2;
        border: 2px solid #2b211f; box-shadow: 7px 7px 0 #2b211f; font: 13px/1.45 ui-monospace, Menlo, monospace; color: #2b211f;
      }
      #changelog h1 { margin: 0 0 10px; font-size: 20px; letter-spacing: 0.14em; }
      #changelog h1 span, #changelog h2 span { font-size: 12px; letter-spacing: 0; opacity: 0.6; font-weight: normal; }
      #changelog .list { overflow-y: auto; padding-right: 8px; }
      #changelog h2 { margin: 14px 0 4px; font-size: 14px; border-bottom: 1px solid #2b211f; }
      #changelog ul { margin: 0; padding-left: 18px; }
      #changelog li { margin: 3px 0; }
      #changelog .buttons { margin-top: 12px; text-align: right; }
      #changelog button { font: inherit; padding: 6px 12px; background: #fffaf0; border: 2px solid #2b211f; cursor: pointer; }
      #changelog .buttons button + button { margin-left: 8px; }
      /* the interactive changelog (changelog.html?embed=1) over the game */
      #changelog iframe.pictures { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #f7ecd2; z-index: 1; }
      #changelog iframe.pictures[hidden] { display: none; }
      #picker .pages { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 18px; }
      #picker .pages a { padding: 6px 12px; color: #2b211f; text-decoration: none; background: #fbf4e2; border: 1.5px solid #2b211f; }
      #picker .pages a:hover, #picker .pages a:focus-visible { background: #fff; outline: none; box-shadow: 3px 3px 0 #2b211f; }
      #picker .continue {
        display: inline-block; margin: 0 0 18px; padding: 8px 14px; color: #2b211f; text-decoration: none; font-weight: bold;
        background: #f2c54b; border: 2px solid #2b211f; box-shadow: 4px 4px 0 #2b211f;
      }
      #picker .card.locked { opacity: 0.6; cursor: default; }
      #picker .card.locked .lock { flex: none; align-self: flex-start; width: 96px; height: 96px; margin: 12px 0 12px 12px; display: grid; place-items: center; font-size: 40px; border: 2px solid #2b211f; background: repeating-linear-gradient(45deg, #efe3c6 0 10px, #e6d8b8 10px 20px); }

      /* touch */
      #touch { display: none; }
      body.touch #touch { display: block; }
      /* a phone: the buttons fill the bottom, the cue goes up top (the toasts make room for it: src/ship/cinema.js) */
      @media (max-width: 700px) { body.touch #cue { bottom: auto; top: calc(12px + var(--safe-top, 0px)); max-width: calc(100vw - 96px); } }
      #touch .stick { position: fixed; width: 140px; height: 140px; border-radius: 50%; border: 2px solid rgba(43, 33, 31, 0.5); background: rgba(255, 250, 240, 0.25); display: none; z-index: 35; pointer-events: none; }
      #touch .stick.on { display: block; }
      #touch .nub { position: absolute; left: 45px; top: 45px; width: 50px; height: 50px; border-radius: 50%; background: rgba(43, 33, 31, 0.55); }
      #touch button {
        position: fixed; z-index: 36; width: 64px; height: 64px; border-radius: 50%; font: 18px ui-monospace, Menlo, monospace;
        color: #2b211f; background: rgba(255, 250, 240, 0.8); border: 2px solid #2b211f; touch-action: none;
      }
      #touch .b-jump { right: 24px; bottom: 90px; width: 78px; height: 78px; font-size: 26px; }
      #touch .b-use { right: 112px; bottom: 40px; }
      #touch .b-run { right: 24px; bottom: 186px; font-size: 13px; }
      #touch .b-run.on { background: #f2c54b; }
      #touch .b-book { right: 112px; bottom: 120px; }
      body.touch #gear { top: 14px; bottom: auto; }
      #loading {
        position: fixed; inset: 0; z-index: 9000; display: grid; place-content: center; justify-items: center; gap: 18px;
        font: 14px ui-monospace, Menlo, monospace; color: #2b211f; background: #f7ecd2; transition: opacity 0.8s;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      /* transform animations run on the compositor, so they keep moving while the world is built: on an HTML
         box of its own (will-change: its own layer from the start; a transform on an SVG root is not
         run off the main thread by every engine), the drawing inside it static */
      #loading .pen { width: 96px; height: 96px; animation: spin 2.4s linear infinite; will-change: transform; }
      #loading .pen svg { display: block; width: 100%; height: 100%; }
      #loading .ring { fill: none; stroke: #2b211f; stroke-width: 2.2; stroke-dasharray: 18 9; }
      #loading .r2 { stroke-dasharray: 4 7; opacity: 0.6; }
      #loading .nib { fill: #c8483a; stroke: #2b211f; stroke-width: 2; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .balloon {
        position: fixed; left: 0; top: 0; z-index: 40; will-change: transform; max-width: 240px; padding: 7px 11px;
        font: 13px/1.35 ui-monospace, Menlo, monospace; color: #2b211f; background: #fffaf0;
        border: 2px solid #2b211f; border-radius: 16px; pointer-events: none; opacity: 0; transition: opacity 0.25s;
      }
      .balloon::after {
        content: ''; position: absolute; left: 22px; bottom: -11px; border: 10px solid transparent;
        border-top-color: #2b211f; border-bottom: 0; border-left: 0;
      }
      .balloon.show { opacity: 1; }
      /* nobody else's chatter while you talk to someone: it landed on top of the choices */
      body.talking .balloon { opacity: 0; transition: none; }

      /* conversations (src/story/dialogue.js): a comic panel along the bottom */
      #dialogue {
        position: fixed; left: 50%; bottom: calc(26px + var(--safe-bottom)); z-index: 75; width: min(720px, calc(100vw - 32px));
        transform: translate(-50%, 24px); opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.3s cubic-bezier(0.2, 0.8, 0.3, 1.2);
        font: 15px/1.5 ui-monospace, Menlo, monospace; color: #2b211f;
      }
      #dialogue.open { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
      #dialogue .dlg-panel {
        position: relative; background: #fffaf0; border: 2.5px solid #2b211f; box-shadow: 6px 6px 0 #2b211f; padding: 26px 22px 14px 112px; min-height: 92px;
        background-image: repeating-linear-gradient(0deg, transparent 0 26px, rgba(43, 33, 31, 0.05) 26px 27px); cursor: pointer;
      }
      /* the portrait at the panel's top-left corner, over its edge */
      #dialogue .dlg-who { position: absolute; left: 14px; top: -36px; }
      #dialogue .dlg-chip {
        width: 84px; height: 84px; border: 2.5px solid #2b211f; border-radius: 50%; overflow: hidden; display: grid; place-items: center;
        box-shadow: 3px 3px 0 #2b211f; transform: rotate(-3deg); background: #d8a24a;
      }
      #dialogue .dlg-chip img { width: 100%; height: 100%; object-fit: cover; display: block; }
      #dialogue .dlg-chip img[hidden] { display: none; }
      #dialogue .dlg-chip img:not([hidden]) + span { display: none; }
      #dialogue .dlg-chip span { font-size: 36px; font-weight: bold; color: #fffaf0; text-shadow: 2px 2px 0 #2b211f; }
      /* who is speaking: a caption box across the panel's top edge, beside the portrait */
      #dialogue .dlg-tag {
        position: absolute; left: 104px; top: 0; transform: translateY(-60%) rotate(-1deg); max-width: calc(100% - 124px); box-sizing: border-box;
        display: flex; align-items: baseline; gap: 12px; padding: 5px 14px 6px; background: #2b211f; color: #fffaf0; box-shadow: 3px 3px 0 #c8483a;
        white-space: nowrap; overflow: hidden;
      }
      #dialogue .dlg-name { letter-spacing: 0.14em; text-transform: uppercase; font-size: 19px; line-height: 1.15; }
      #dialogue .dlg-title { font-size: 12.5px; opacity: 0.85; overflow: hidden; text-overflow: ellipsis; }
      #dialogue .dlg-title:empty { display: none; }
      #dialogue .dlg-text { margin: 4px 0 8px; min-height: 2.9em; }
      #dialogue .dlg-text.player { font-style: italic; color: #34405e; }
      /* *highlights*: the places to go, the things to do (in the panel, the choices and the balloons) */
      #dialogue .dlg-text em, #dialogue .dlg-choices em, .balloon em { font-style: normal; font-weight: bold; color: #b23a2c; background: #f2c54b4d; padding: 0 2px; border-radius: 2px; }
      #dialogue .dlg-text em.quote, .balloon em.quote { font-weight: normal; color: inherit; background: #f2c54b55; }   /* a quoted letter or recording */
      #dialogue .dlg-caret { animation: blink 0.8s steps(1) infinite; opacity: 0.6; }
      @keyframes blink { 50% { opacity: 0; } }
      /* the line is done: a small pointer in the corner (any press turns the page) */
      #dialogue .dlg-more { display: none; position: absolute; right: 16px; bottom: 11px; width: 0; height: 0;
        border: 7px solid transparent; border-top: 9px solid #c8483a; border-bottom: 0; animation: dlg-more 1s ease-in-out infinite; }
      #dialogue.more .dlg-more { display: block; }
      @keyframes dlg-more { 50% { transform: translateY(3px); } }
      #dialogue .glyph, .balloon .glyph { width: 1.6em; height: 1.05em; vertical-align: -0.12em; fill: #3aa6a8; stroke: #3aa6a8; margin: 0 2px; }
      #dialogue .dlg-choices { display: flex; flex-direction: column; gap: 5px; }
      /* an answer: its mark in a column of its own, its words beside it (they wrap beside the mark, never under or over it) */
      #dialogue .dlg-choices button {
        display: flex; align-items: flex-start; gap: 0.6em; width: 100%; box-sizing: border-box;
        text-align: left; font: inherit; font-size: 0.93em; line-height: 1.5; color: #2b211f; background: #f3e7cc; border: 1.5px solid #2b211f; padding: 5px 10px; cursor: pointer;
        box-shadow: 2px 2px 0 #2b211f; transition: transform 0.08s;
      }
      #dialogue .dlg-choices button:hover, #dialogue .dlg-choices button:focus { background: #fff6dc; transform: translate(-1px, -1px); box-shadow: 3px 3px 0 #2b211f; outline: none; }
      #dialogue .dlg-say { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
      /* the mark's column: one line tall, its marks stacked in one cell (src/story/dialogue.js choiceHtml) */
      #dialogue .dlg-key { flex: 0 0 auto; display: grid; place-items: center; min-width: 1.1em; height: 1.5em; color: #c8483a; font-weight: bold; }
      #dialogue .dlg-key > * { grid-area: 1 / 1; }
      #dialogue .dlg-key .key { font-size: 0.82em; min-width: 1.8em; height: 1.8em; }
      /* the keyboard: the number to press; a touch screen: a plain mark */
      #dialogue .dlg-mark, #dialogue .dlg-key .key { display: none; }
      body.touch #dialogue .dlg-num { display: none; }
      body.touch #dialogue .dlg-mark { display: block; }
      /* a controller: the confirm button's badge on the answer it would pick, a mark on the others */
      body.controller #dialogue .dlg-num { display: none; }
      body.controller #dialogue .dlg-mark { display: block; }
      body.controller #dialogue .dlg-key .key { display: inline-flex; visibility: hidden; }
      body.controller #dialogue button:focus .dlg-key .key { visibility: visible; }
      body.controller #dialogue button:focus .dlg-mark { visibility: hidden; }
      /* the translator: words still in the speaker's own script (src/story/scripts.js: inline svg, its ink inline) */
      #dialogue svg.tg { pointer-events: none; }
      /* a big screen (a 1080p handheld or a monitor): a bigger panel, read from arm's length */
      @media (min-width: 1700px) and (min-height: 900px) {
        #dialogue { width: min(920px, calc(100vw - 32px)); font-size: 19px; bottom: calc(40px + var(--safe-bottom)); }
        #dialogue .dlg-panel { padding: 34px 28px 18px 140px; min-height: 116px; }
        #dialogue .dlg-who { top: -46px; left: 16px; }
        #dialogue .dlg-chip { width: 108px; height: 108px; }
        #dialogue .dlg-tag { left: 132px; max-width: calc(100% - 156px); padding: 6px 18px 7px; }
        #dialogue .dlg-name { font-size: 24px; }
        #dialogue .dlg-title { font-size: 15px; }
        #dialogue .dlg-more { border-width: 9px; border-top-width: 11px; right: 20px; bottom: 14px; }
      }
      @media (max-width: 600px) {
        #dialogue { font-size: 13px; bottom: calc(150px + var(--safe-bottom)); }
        #dialogue .dlg-panel { padding: 36px 12px 12px 12px; }
        #dialogue .dlg-chip { width: 60px; height: 60px; }
        #dialogue .dlg-who { top: -32px; left: 10px; }
        #dialogue .dlg-tag { left: 78px; max-width: calc(100% - 88px); flex-direction: column; align-items: flex-start; gap: 0; white-space: normal; padding: 4px 10px 5px; }
        #dialogue .dlg-name { font-size: 16px; }
        #dialogue .dlg-title { font-size: 11px; }
      }
      /* the prompt over whoever (or whatever) the use button would use: a round button badge and the action */
      #prompt {
        position: fixed; left: 0; top: 0; z-index: 39; will-change: transform; pointer-events: none; opacity: 0; transition: opacity 0.2s;
        font: 12px ui-monospace, Menlo, monospace; color: #2b211f; background: #fffaf0; border: 1.5px solid #2b211f; padding: 3px 10px 3px 4px; white-space: nowrap;
        box-shadow: 2px 2px 0 #2b211f; border-radius: 14px; display: flex; align-items: center; gap: 6px;
      }
      #prompt.show { opacity: 1; }
      /* a button, wherever a prompt names one: a small ink circle (a pill for the two-glyph "X / □" names) */
      .key {
        display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; min-width: 1.75em; height: 1.75em; padding: 0 0.45em;
        border-radius: 999px; background: #2b211f; color: #fffaf0; font-weight: bold; font-size: 0.95em; line-height: 1; vertical-align: middle;
      }
      /* the father's charge (src/story/charge.js): its own gold tag on the objective line */
      @media (min-width: 1700px) and (min-height: 900px) {
        #prompt { font-size: 15px; padding: 4px 13px 4px 5px; border-radius: 18px; gap: 8px; }
        body:not(.touch) #cue:not(.place) { font-size: 15px; }
      }
      /* in a conversation only the panel speaks: no prompts, no button lists */
      body.talking .balloon, body.talking #prompt, body.talking #controller-hint, body.talking #gear { visibility: hidden; }
      /* the conversation is answered by tapping the panel: the game buttons would sit under and round it */
      body.talking #touch { visibility: hidden; }
      #touch .b-use.talk { font-size: 13px; }
      /* the game menu (View / Select, J: src/game-menu.js): its styles are in src/menus.css */

      #toast {
        position: fixed; left: 50%; top: 22px; transform: translateX(-50%); z-index: 60; padding: 8px 14px;
        font: 13px ui-monospace, Menlo, monospace; color: #2b211f; background: #fffaf0; border: 2px solid #2b211f;
        box-shadow: 4px 4px 0 #2b211f; opacity: 0; pointer-events: none;
      }
      #toast.show { animation: toast 4.5s forwards; }
      /* the toast is placed in the stack of things written on the screen (src/ship/cinema.js layoutCinema):
         one line where it can, centred, and over the letterbox's frame during a scene, below its top bar */
      #toast { width: max-content; max-width: calc(100vw - 32px); box-sizing: border-box; text-align: center; transition: top 0.3s; }
      body.cine-on #toast { z-index: 8050; }
      @keyframes toast { 0% { opacity: 0; transform: translate(-50%, -8px); } 8%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

      #page {
        position: fixed; inset: 0; z-index: 80; display: none; place-items: center;
        background: rgba(43, 33, 31, 0.55); cursor: pointer;
      }
      #page.open { display: grid; animation: pagein 0.5s ease-out; }
      @keyframes pagein { from { opacity: 0; transform: rotate(-1.5deg) scale(0.97); } }
      #page .sheet {
        width: min(960px, 92vw, calc((100vh - 110px) / 0.8)); padding: 22px; background: #f7ecd2; border: 2px solid #2b211f; box-shadow: 8px 8px 0 #2b211f;
        display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; transform: rotate(-0.6deg); box-sizing: border-box;
      }
      #page .p { min-width: 0; position: relative; border: 3px solid #2b211f; background: #efe3c6; overflow: hidden; }
      #page .p img { display: block; width: 100%; height: 100%; object-fit: cover; }
      #page .p1 { grid-column: 1 / 3; aspect-ratio: 900 / 380; }
      #page .p2 { aspect-ratio: 440 / 300; transform: rotate(0.5deg); }
      #page .p3 { aspect-ratio: 440 / 300; transform: rotate(-0.4deg); }
      #page .cap {
        position: absolute; left: 12px; top: 12px; max-width: 46%; padding: 7px 10px; background: #fff6dc;
        border: 2px solid #2b211f; font: 13px/1.4 ui-monospace, Menlo, monospace; color: #2b211f;
      }
      #page .cap b { letter-spacing: 0.12em; }
      #page .hint { grid-column: 1 / 3; text-align: right; font: 20px/1 ui-monospace, Menlo, monospace; color: #c8483a; margin: -6px 2px -8px 0; }

      @media (max-width: 600px) {
        #page .sheet { width: 92vw; padding: 12px; gap: 8px; max-height: calc(100dvh - 32px); overflow: auto; }
        #page .p1 { aspect-ratio: auto; }
        #page .p1 img { height: auto; aspect-ratio: 900 / 380; }
        #page .cap { position: static; max-width: none; margin: 8px; font-size: 11px; }
        #page .hint { font-size: 16px; }
      }

      /* The canvas fills the screen; interactive UI stays inside iOS safe areas. */
      #gear { right: calc(14px + var(--safe-right)); bottom: calc(14px + var(--safe-bottom)); }
      /* the frame-time readout (when asked for: F, the settings, ?fps=1) sits top right */
      #fps { right: calc(14px + var(--safe-right)); top: calc(14px + var(--safe-top)); bottom: auto; }
      body.touch #gear { top: calc(12px + var(--safe-top)); bottom: auto; }
      body.touch #fps { top: auto; bottom: calc(14px + var(--safe-bottom)); left: calc(16px + var(--safe-left)); right: auto; }
      #touch .b-jump { right: calc(24px + var(--safe-right)); bottom: calc(90px + var(--safe-bottom)); }
      #touch .b-use { right: calc(112px + var(--safe-right)); bottom: calc(40px + var(--safe-bottom)); }
      #touch .b-run { right: calc(24px + var(--safe-right)); bottom: calc(186px + var(--safe-bottom)); }
      #touch .b-book { right: calc(112px + var(--safe-right)); bottom: calc(120px + var(--safe-bottom)); }
      #changelog, #page { box-sizing: border-box; padding: calc(12px + var(--safe-top)) calc(12px + var(--safe-right)) calc(12px + var(--safe-bottom)) calc(12px + var(--safe-left)); }
      #changelog .panel, #page .sheet { box-sizing: border-box; max-width: 100%; max-height: calc(100dvh - 32px - var(--safe-top) - var(--safe-bottom)); overflow: auto; }
      #picker { padding: calc(24px + var(--safe-top)) calc(20px + var(--safe-right)) calc(24px + var(--safe-bottom)) calc(20px + var(--safe-left)); }
      #picker header { flex-wrap: wrap; gap: 12px; }
      #picker header .hint { font-style: normal; }
      @media (display-mode: standalone) { .install-tip { display: none; } }
      #touch .b-ping { right: calc(112px + var(--safe-right)); bottom: calc(200px + var(--safe-bottom)); font-size: 13px; }
      #controller-hint { display: none; position: fixed; z-index: 1000; bottom: calc(8px + var(--safe-bottom)); left: 50%; transform: translateX(-50%); width: max-content; max-width: 90%; padding: 7px 12px; background: #f7eed9ed; border: 1px solid #473d36; font: 12px monospace; pointer-events: none; }
      body.controller.controller-hint #controller-hint { display: block; }
      /* holding a controller (a Retroid, a pad on a phone): no buttons on the screen at all */
      body.controller #touch, body.controller #gear { display: none; }
      body.controller :focus { outline: 3px solid #277e86; outline-offset: 4px; }
      /* the traveller's tool: crosshair + mode while aiming */
      #tool { position: fixed; left: 50%; top: 50%; z-index: 30; pointer-events: none; transform: translate(-50%, -50%);
        opacity: 0; visibility: hidden; transition: opacity 0.4s, visibility 0s 0.4s; }
      body.aiming #tool, body.tool-gauge #tool { opacity: 1; visibility: visible; transition: opacity 0.15s; }
      body:not(.aiming) #tool .cross { visibility: hidden; }
      body.talking #tool { visibility: hidden; }
      #tool .cross { position: relative; width: 24px; height: 24px; border: 2px solid #2b211f; border-radius: 50%; box-shadow: 0 0 0 1.5px rgba(247, 236, 210, 0.75), inset 0 0 0 1.5px rgba(247, 236, 210, 0.6); transition: transform 0.12s; }
      #tool .cross::after { content: ''; position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; margin: -1.5px; border-radius: 50%; background: #2b211f; }
      #tool .cross i { position: absolute; background: #2b211f; box-shadow: 0 0 0 1px rgba(247, 236, 210, 0.7); }
      #tool .cross i:nth-child(1) { left: 50%; top: -11px; width: 2px; height: 7px; margin-left: -1px; }
      #tool .cross i:nth-child(2) { left: 50%; bottom: -11px; width: 2px; height: 7px; margin-left: -1px; }
      #tool .cross i:nth-child(3) { top: 50%; left: -11px; height: 2px; width: 7px; margin-top: -1px; }
      #tool .cross i:nth-child(4) { top: 50%; right: -11px; height: 2px; width: 7px; margin-top: -1px; }
      #tool.fluid .cross::after { background: #966ede; width: 5px; height: 5px; margin: -2.5px; }
      #tool.empty .cross { border-style: dashed; opacity: 0.55; }
      #tool.lock .cross { transform: scale(0.8) rotate(45deg); border-color: #c8483a; border-style: solid; }
      #tool.lock .cross i { background: #c8483a; }
      #tool.wait .cross { opacity: 0.45; }
      #tool .cross.hit { animation: toolhit 0.3s ease-out; }
      #tool .cross.empty { animation: toolempty 0.3s; }
      @keyframes toolhit { 0% { transform: scale(1.9); border-color: #c8483a; } 100% { transform: scale(1); } }
      @keyframes toolempty { 0%, 100% { translate: 0; } 30% { translate: -3px; } 70% { translate: 3px; } }
      #tool .mode { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 1px 7px;
        font: 11px/1.5 ui-monospace, Menlo, monospace; color: #2b211f; background: rgba(247, 236, 210, 0.85); border: 1px solid #2b211f; }
      #tool .mode b { font-weight: normal; letter-spacing: 0.08em; text-transform: uppercase; }
      #touch .b-aim { right: calc(200px + var(--safe-right)); bottom: calc(150px + var(--safe-bottom)); font-size: 24px; }
      #touch .b-aim.on { background: #9fd6e8; }
      #touch .b-fire { right: calc(200px + var(--safe-right)); bottom: calc(60px + var(--safe-bottom)); width: 74px; height: 74px; font-size: 26px; }
      #touch .b-mode { right: calc(282px + var(--safe-right)); bottom: calc(96px + var(--safe-bottom)); width: 50px; height: 50px; font-size: 22px; }
      #touch .b-lock { right: calc(282px + var(--safe-right)); bottom: calc(232px + var(--safe-bottom)); width: 40px; height: 40px; font-size: 18px; }
      body:not(.combat) #touch .b-lock { display: none; }   /* (only with a foe near: src/foes.js) */
      #touch .b-blade { right: calc(282px + var(--safe-right)); bottom: calc(166px + var(--safe-bottom)); width: 54px; height: 54px; font-size: 22px; }
      body:not(.modes) #touch .b-mode { display: none; }
      /* no backpack yet: no tool buttons, no tool hints (ui.js ToolHud sets .no-tool) */
      body.no-tool #touch .b-aim, body.no-tool #touch .b-fire, body.no-tool #touch .b-mode, body.no-tool #touch .b-blade { display: none; }
      /* the gun modes: the label and the crosshair's dot take the mode's colour */
      body.modeflash #tool { opacity: 1; visibility: visible; transition: opacity 0.15s; }
      body.modeflash:not(.aiming) #tool .mode { animation: modeflash 1.6s ease-out forwards; }
      @keyframes modeflash { 0% { transform: translateX(-50%) scale(1.35); } 15% { transform: translateX(-50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
      #tool.m-stun .mode b { color: #3d74c4; }
      #tool.m-fire .mode b { color: #cf4f2c; }
      #tool.m-stun .cross::after { background: #7fb6e6; }
      #tool.m-fire .cross::after { background: #ef7a3c; }
      #tool.m-push .mode b { color: #3d7fa8; }
      #tool.m-push .cross { transform: scale(1.35); }
      #tool.m-bloom .mode b { color: #3f8a46; }
      #tool.m-bloom .cross::after { background: #e58aa0; }
      #touch .b-mode { color: #2b211f; }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="pen"><svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ring" cx="60" cy="60" r="44" />
        <circle class="ring r2" cx="60" cy="60" r="30" />
        <path class="nib" d="M60 14 L66 34 L60 40 L54 34 Z" />
      </svg></div>
      <div class="msg">sketching the world…</div>
    </div>
    <div id="journal"></div>
    <div id="page"></div>
    <div id="toast"></div>
    <div id="dialogue"></div>
    <div id="prompt"></div>
    <div id="settings"></div>
    <div id="touch"></div>
    <div id="tool"></div>
    <button id="gear" title="Menu (O)" aria-label="Menu">⚙</button>
    <div id="fps"></div>
    <div id="photo">PHOTO MODE · WASD + Q/E fly · mouse look · SHIFT fast · H panel · ENTER save PNG · P exit</div>
    <div id="picker">
      <header>
        <h1>HIRAETH — choose a world</h1>
        <span><em class="hint">press a number · L to toggle this screen</em> <button class="close">close ✕</button></span>
      </header>
      <div class="cards"></div>
    </div>
    <div id="cue" aria-live="polite"></div>
    <div id="health"><i></i></div>
    <div id="stamina" aria-hidden="true"><svg viewBox="-20 -20 40 40">
      <circle r="16" cx="1.8" cy="1.8" fill="#2b211f" />
      <circle r="16" fill="#f7ecd2" stroke="#2b211f" stroke-width="2.2" />
      <circle class="arc" r="11" pathLength="100" stroke-dasharray="100 100" transform="rotate(-90)" />
      <circle r="15" fill="none" stroke="#2b211f" stroke-width="0.8" stroke-dasharray="1.6 2.4" opacity="0.5" />
      <circle r="6.6" fill="#f7ecd2" stroke="#2b211f" stroke-width="1.6" />
    </svg></div>
    <div id="restart" role="dialog" aria-label="Knocked out"><div class="sheet"><p>That was too far a fall.</p><button type="button">Restart</button><small></small></div></div>
    <script type="module" src="/src/boot.js"></script>
  </body>
