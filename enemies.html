<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hiraeth — creatures & spirits</title>
<style>
:root{color:#302936;background:#f1e6d0;font:16px/1.5 Georgia,serif}*{box-sizing:border-box}body{margin:0}header{padding:20px 32px;border-bottom:1px solid #b7a98f;display:flex;justify-content:space-between;align-items:center}header a,a{color:inherit}h1{font-size:23px;margin:0}main{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:calc(100vh - 80px)}#stage{min-height:640px;touch-action:none;overflow:hidden}#stage canvas{width:100%;height:100%;display:block}aside{padding:24px;border-left:1px solid #b7a98f;background:#f8efdc}select,button,.fight{font:inherit;color:inherit;border:1px solid #958875;border-radius:5px;background:#f5ecd9;padding:9px;max-width:100%}select{width:100%;margin:5px 0 16px}label{display:block;font-size:14px}h2{font-size:24px;line-height:1.15;margin:10px 0}p{font-size:14px}button{cursor:pointer;text-align:left;background:#e7dfd0}#moves p{margin-top:6px;color:#615768}.fight{display:block;text-align:center;margin-top:12px;text-decoration:none;background:#d9d9c5}#calm{border-top:1px solid #b7a98f;padding-top:12px}.hint{font-style:italic;color:#786b63}@media(max-width:760px){main{display:block}#stage{height:55vh;min-height:360px}aside{border-left:0;border-top:1px solid #b7a98f}header{padding:16px}h1{font-size:19px}}
