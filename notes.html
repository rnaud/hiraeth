<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf9f6">
  <meta name="robots" content="noindex, nofollow">
  <title>Hiraeth — Notes</title>
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="stylesheet" href="/src/notes-page/style.css">
</head>
<body data-debug-back="from-debug">
  <div class="notebook">
    <header class="debug-room">
      <a class="wordmark" href="./">Notes</a>
      <nav aria-label="Notebook"><a href="./">Hiraeth ↗</a><button id="lock" class="text-button" hidden>Sign out</button></nav>
    </header>
    <main>
      <p id="notice" class="notice" role="status" aria-live="polite">Opening your notebook…</p>
      <section id="signin" class="signin" aria-labelledby="signin-title" hidden>
        <div><h2 id="signin-title">Sign in once</h2><p>This device will remember you.</p>
          <form id="login-form"><label for="password">Notebook password</label><div class="input-row"><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024"><button id="unlock" type="submit">Unlock <span aria-hidden="true">→</span></button></div></form>
        </div>
      </section>
      <section id="board" hidden>
        <form id="note-form" class="composer">
          <label class="sr-only" for="new-note">Add a note</label>
          <div class="input-row"><textarea id="new-note" name="note" rows="1" placeholder="Add a note…" maxlength="4000" autocomplete="off" required></textarea><button id="add" type="submit">Add</button></div>
          <div class="composer-foot"><span id="draft-hint">Enter for a new line · ⌘/Ctrl + Enter to add</span><span id="length" aria-hidden="true">0 / 4000</span></div>
        </form>
        <section class="open-notes" aria-labelledby="open-title">
          <div class="list-heading"><h2 id="open-title">To do <span id="count"></span></h2><button id="refresh" class="text-button">Refresh <span aria-hidden="true">↻</span></button></div>
          <label class="sr-only" for="search">Find a note in the loaded list</label><input id="search" type="search" placeholder="Find a note…" autocomplete="off">
          <p id="list-status" role="status" aria-live="polite"></p>
          <ul id="issues" aria-label="Open issues"></ul>
          <button id="more" class="more" hidden>Load more notes</button>
        </section>
      </section>
      <noscript><p>Turn on JavaScript to open the notebook.</p></noscript>
    </main>
    <footer><span>Saved to <a href="https://github.com/rnaud/hiraeth/issues" target="_blank" rel="noopener noreferrer">Hiraeth’s issues ↗</a></span></footer>
  </div>
  <script type="module" src="/src/notes-page/main.js"></script>
  <script type="module" src="/src/debug-back-page.js"></script>
</body>
</html>
