<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hiraeth — temple maps</title>
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<style>
  /* The temple maps (src/temple-maps/, issue #396): each temple's plan, its lock-and-key graph, its solution and numbers */
  :root { --paper: #f7ecd2; --card: #fbf4e2; --ink: #2b211f; --rule: rgba(43, 33, 31, 0.22); --soft: #7a5238; --hot: #d0312d; --path: #2f6fd6; --key: #b07a00; --ok: #2e8a48; }
  html, body { margin: 0; height: 100%; background: #efe6d2; color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  /* (the game's modules add their own cards to the page: hidden, only the maps are shown) */
  body > *:not(#app):not(.debug-back):not(script) { display: none !important; }
  #app { position: fixed; inset: 0; display: grid; grid-template-rows: auto auto 1fr; grid-template-columns: 1fr minmax(320px, 420px); }
  header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 8px 12px 8px 104px; background: var(--card); border-bottom: 2px solid var(--ink); }
  h1 { margin: 0; font-size: 16px; letter-spacing: 0.12em; white-space: nowrap; }
  select, button, input { font: inherit; font-size: 13px; padding: 4px 8px; background: #fffaf0; border: 1.5px solid var(--ink); color: var(--ink); border-radius: 3px; }
  button { cursor: pointer; }
  button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
  input[type=number] { width: 90px; }
  .gap { flex: 1; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; margin-left: -1.5px; }
  .seg button:first-child { border-radius: 3px 0 0 3px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 3px 3px 0; }
  #sub { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 6px 12px; background: var(--paper); border-bottom: 1px solid var(--rule); font-size: 13px; }
  #sub .id { font-weight: 700; }
  #sub .muted, .muted { color: var(--soft); }
  #stage { position: relative; overflow: hidden; background: #f3e8cc; touch-action: none; }
  #stage svg { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
  #stage svg:active { cursor: grabbing; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  #stage.three canvas { display: block; }
  #stage.three svg { display: none; }
  #zoom { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 2; }
  #zoom button { width: 34px; height: 34px; padding: 0; font-size: 17px; background: var(--card); }
  #legend { position: absolute; left: 10px; bottom: 10px; z-index: 2; background: rgba(251, 244, 226, 0.94); border: 1.5px solid var(--ink); padding: 6px 8px; font-size: 12px; max-width: 280px; }
  #legend summary { cursor: pointer; font-weight: 600; }
  #legend .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  #legend svg { width: 26px; height: 14px; flex: none; }
  aside { position: relative; overflow-y: auto; border-left: 2px solid var(--ink); background: var(--card); }
  aside section { padding: 10px 12px; border-bottom: 1px solid var(--rule); }
  aside h2 { margin: 0 0 6px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--soft); font-weight: 600; display: flex; align-items: center; gap: 6px; }
  aside h2 .gap { flex: 1; }
  #nav { display: flex; gap: 6px; align-items: center; }
  #nav span { min-width: 74px; text-align: center; }
  ol.steps { list-style: none; margin: 0; padding: 0; }
  ol.steps li { padding: 6px 6px 6px 34px; position: relative; border-radius: 4px; cursor: pointer; border: 1.5px solid transparent; }
  ol.steps li + li { margin-top: 2px; }
  ol.steps li:hover { background: rgba(47, 111, 214, 0.08); }
  ol.steps li.on { border-color: var(--path); background: rgba(47, 111, 214, 0.12); }
  ol.steps li.done { opacity: 0.62; }
  ol.steps li .n { position: absolute; left: 4px; top: 6px; width: 24px; height: 24px; border-radius: 50%; background: var(--path); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
  ol.steps li.extra .n { background: #9b8a74; font-size: 10.5px; }
  ol.steps .meta { font-size: 12px; color: var(--soft); margin-top: 2px; }
  ol.steps .ref { font-size: 11px; font-weight: 700; color: var(--ink); background: #efe0bf; border-radius: 3px; padding: 0 4px; cursor: copy; }
  .tag { display: inline-block; font-size: 11px; padding: 0 5px; border-radius: 8px; background: #efe0bf; margin: 1px 2px 0 0; }
  .tag.hidden { background: #f6d2c8; }
  table.nums { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.nums td { padding: 3px 4px; border-bottom: 1px dotted var(--rule); vertical-align: top; }
  table.nums td:last-child { text-align: right; font-weight: 600; }
  #busy { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 0.08em; background: rgba(239, 230, 210, 0.86); }
  #busy[hidden] { display: none; }
  #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: var(--card); padding: 6px 12px; border-radius: 4px; font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 9; }
  #toast.on { opacity: 1; }
  svg text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .dim { opacity: 0.13; }
  @media (max-width: 820px) {
    #app { position: static; display: block; }
    html, body { height: auto; }
    header { padding-left: 96px; }
    #stage { height: 62vh; border-bottom: 2px solid var(--ink); }
    aside { border-left: 0; }
    #legend { max-width: 200px; }
    #sub .carried { display: none; }
  }
</style>
</head>
<body data-debug-back="pad-off">
<div id="app">
  <header>
    <h1 class="debug-room">TEMPLE MAPS</h1>
    <select id="temple" aria-label="The temple"></select>
    <label id="seedBox" hidden>seed <input id="seed" type="number" min="1" max="999999" aria-label="The run's seed"> <button id="reseed" title="Draw another run">new run</button></label>
    <span class="gap"></span>
    <span class="seg" id="views" role="group" aria-label="What is shown">
      <button data-view="plan" aria-pressed="true">Plan</button><button data-view="graph" aria-pressed="false">Flow graph</button><button data-view="three" aria-pressed="false">3D</button>
    </span>
  </header>
  <div id="sub"></div>
  <div id="stage">
    <svg id="svg" aria-label="The map: drag to move, wheel or pinch to zoom"></svg>
    <canvas id="view" aria-label="The temple in 3D: drag to turn, right-drag to move, wheel to zoom"></canvas>
    <div id="zoom"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button><button id="zfit" title="Fit">⤢</button></div>
    <details id="legend" open><summary>Key</summary><div class="body"></div></details>
    <div id="busy">building the temple…</div>
  </div>
  <aside>
    <section id="solution"></section>
    <section id="numbers"></section>
  </aside>
</div>
<div id="toast"></div>
<script type="module" src="/src/temple-maps/main.js"></script>
<script type="module" src="/src/debug-back-page.js"></script>
</body>
</html>
