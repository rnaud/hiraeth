<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7ecd2">
<title>Hiraeth · The lore</title>
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<style>
  /* The lore page (src/lore-page/, docs/systems/lore-page.md): the game's ink and paper */
  :root { --paper: #f7ecd2; --card: #fbf4e2; --ink: #2b211f; --soft: #6d5f57; --rule: #d8c9a8; --accent: #8a5a3c; --jade: #3d8f80; --gold: #f2c54b; --bad: #b2452f; }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 70px; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 Georgia, 'Iowan Old Style', serif; }
  button, input, textarea { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .mono, .meta, nav, .note-btn, .btn, small, summary, .page-title, h2, .n { font-family: ui-monospace, Menlo, Consolas, monospace; }

  body > header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 8px; background: var(--paper); border-bottom: 2px solid var(--ink); }
  h1 { margin: 0; font: bold 18px ui-monospace, Menlo, monospace; letter-spacing: 0.16em; }
  #sections { display: flex; gap: 4px 12px; flex-wrap: wrap; flex: 1 1 auto; font-size: 13px; }
  #sections a { text-decoration: none; border-bottom: 1.5px solid var(--rule); }
  .links { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn { padding: 4px 10px; background: var(--card); border: 2px solid var(--ink); text-decoration: none; font-size: 12.5px; white-space: nowrap; }
  .btn:hover { background: #fff; }

  main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 60px; }
  .band { margin-top: 28px; }
  h2 { font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; border-bottom: 2px solid var(--ink); padding-bottom: 4px; margin: 0 0 14px; }
  h2 small, h3 small, h4 small, h5 small { font-size: 11.5px; font-weight: normal; letter-spacing: 0.04em; text-transform: none; color: var(--accent); margin-left: 6px; }
  h3, h4, h5 { margin: 0; }
  h3 { font-size: 19px; } h4 { font-size: 16.5px; } h5 { font-size: 14.5px; }
  p { margin: 0 0 8px; }
  .head { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; margin-bottom: 6px; }
  .meta { font-size: 11.5px; letter-spacing: 0.05em; color: var(--accent); }
  .said { font-style: italic; color: var(--soft); }
  em { font-style: italic; }

  /* the Note button: small, on every part */
  .note-btn { flex: none; padding: 1px 8px; font-size: 11px; letter-spacing: 0.06em; background: transparent; border: 1.5px solid var(--ink); border-radius: 10px; cursor: pointer; opacity: 0.55; }
  .note-btn:hover, .note-btn:focus-visible { opacity: 1; background: var(--card); }
  .note-btn::before { content: '✎ '; }
  .note-btn.noted { opacity: 1; background: var(--jade); color: #fff; border-color: var(--jade); }
  .note-btn.noted::before { content: '✓ '; }

  .part, .temple, .guardian, .item, .person { background: var(--card); border: 2px solid var(--ink); padding: 12px 14px; }
  .part { margin-bottom: 14px; box-shadow: 4px 4px 0 var(--ink); }
  details.ending { margin-top: 8px; border-top: 1.5px dashed var(--rule); padding-top: 6px; }
  details > summary { cursor: pointer; font-size: 12.5px; color: var(--accent); }
  details.ending[open] > summary { margin-bottom: 6px; }

  figure { margin: 0; }
  figure img { display: block; width: 100%; height: auto; border: 2px solid var(--ink); background: #f3e7cc; }
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 12px; margin: 6px 0 12px; }
  .portrait img { aspect-ratio: 1; object-fit: cover; }
  .gear { margin: 10px 0 0; }
  .gear > div { padding: 6px 0; border-top: 1px solid var(--rule); }
  .gear dt { font-weight: bold; display: flex; gap: 10px; justify-content: space-between; align-items: baseline; }
  .gear dd { margin: 2px 0 0; }

  .toc { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; margin-bottom: 18px; }
  .world { margin: 0 0 34px; padding-top: 6px; }
  .world-head { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: start; margin-bottom: 10px; }
  .world-head .pic img { aspect-ratio: 16 / 10; object-fit: cover; box-shadow: 4px 4px 0 var(--ink); }
  .n { display: inline-block; min-width: 1.6em; padding: 0 4px; margin-right: 4px; background: var(--ink); color: var(--paper); text-align: center; font-size: 14px; }
  .page-title { margin: 0 0 4px; font-size: 12px; letter-spacing: 0.14em; color: var(--accent); }
  .blurb { font-size: 14px; }
  .lore { max-width: 760px; }
  .temples { display: grid; gap: 14px; margin: 12px 0; }
  .temple { box-shadow: 5px 5px 0 var(--ink); }
  .temple > .body { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
  .gadget { border-left: 4px solid var(--jade); padding: 4px 0 4px 10px; margin: 6px 0; overflow: hidden; }
  .gadget .thumb { float: left; margin: 0 10px 4px 0; }
  .thumb.blank { display: inline-flex; align-items: center; justify-content: center; font-size: 28px; color: var(--soft); }
  .thumb { width: 64px; height: 64px; object-fit: contain; background: #f3e7cc; border: 1.5px solid var(--ink); }
  .guardian { margin-top: 12px; background: #fff8ea; }
  .guardian > .body { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
  .phases { margin: 4px 0 8px; padding-left: 20px; }
  .phases li { margin: 3px 0; }
  .verb { margin: 4px 0 2px; padding: 4px 8px; border: 1.5px dashed var(--accent); background: var(--card); font-size: 14px; }
  .after { border-top: 1px solid var(--rule); padding-top: 6px; margin: 10px 0 0; }
  .people ul { list-style: none; padding: 0; margin: 8px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 10px; }
  .person { padding: 8px 10px; font-size: 14px; }
  .person p { margin-bottom: 4px; }

  h3.kind { margin: 18px 0 8px; font: bold 13px ui-monospace, Menlo, monospace; letter-spacing: 0.12em; text-transform: uppercase; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(460px, 100%), 1fr)); gap: 12px; }
  .item { display: flex; gap: 12px; font-size: 14px; box-shadow: 3px 3px 0 var(--ink); }
  .item > div { min-width: 0; flex: 1; }
  .item .thumb { width: 84px; height: 84px; flex: none; }
  .key-to { border-left: 3px solid var(--jade); padding-left: 8px; }
  .where { margin: 4px 0 0; padding-left: 18px; font-size: 13px; }

  /* the note box */
  dialog { width: min(520px, calc(100vw - 24px)); padding: 14px 16px; background: var(--card); color: var(--ink); border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); }
  dialog::backdrop { background: rgba(43, 33, 31, 0.35); }
  dialog h2 { font-size: 14px; border: 0; margin: 0 0 2px; }
  #note-about { margin: 0 0 10px; font-weight: bold; }
  #note-text { width: 100%; min-height: 120px; padding: 8px; background: #fff; border: 2px solid var(--ink); resize: vertical; }
  .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--soft); }
  .row button, #note-close { padding: 4px 12px; background: var(--ink); color: var(--paper); border: 2px solid var(--ink); cursor: pointer; font-family: ui-monospace, Menlo, monospace; }
  #note-close { background: var(--card); color: var(--ink); }
  #note-status { margin: 8px 0 0; font-size: 14px; }
  #note-status.error { color: var(--bad); }
  .box-foot { display: flex; justify-content: flex-end; margin-top: 10px; }

  @media (max-width: 760px) {
    body > header { position: static; }
    html, body { font-size: 14.5px; }
    .world-head, .temple > .body, .guardian > .body, .pair { grid-template-columns: minmax(0, 1fr); }
    .guardian > .body > .pic { order: -1; }
    .item .thumb { width: 64px; height: 64px; }
  }
</style>
</head>
<body data-debug-back>
<header>
  <h1 class="debug-room">THE LORE</h1>
  <nav id="sections" aria-label="The page’s parts"></nav>
  <div class="links"><a class="btn" id="notes-link" href="notes.html">Notes</a><a class="btn" href="changelog.html">What changed</a><a class="btn" href="items.html">Items</a><a class="btn" href="./">Play</a></div>
</header>
<main id="lore"></main>
<dialog id="note-box" aria-labelledby="note-title">
  <h2 id="note-title">A note on</h2>
  <p id="note-about"></p>
  <form id="note-form" hidden>
    <label class="mono" for="note-text" style="font-size:12px">The first line is the issue’s title.</label>
    <textarea id="note-text" required placeholder="What should change here?"></textarea>
    <div class="row"><span>⌘/Ctrl + Enter to send · filed as a GitHub issue</span><button id="note-send" type="submit">Send</button></div>
  </form>
  <p id="note-status" role="status" aria-live="polite"></p>
  <div class="box-foot"><button id="note-close" type="button">Close</button></div>
</dialog>
<noscript><p>Turn on JavaScript to read the lore.</p></noscript>
<script type="module" src="/src/lore-page/main.js"></script>
<script type="module" src="/src/debug-back-page.js"></script>
</body>
</html>
