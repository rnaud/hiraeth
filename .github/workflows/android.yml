name: Android release

# Every push to main whose tests pass builds a signed APK (the web game in GeckoView, Mozilla's
# engine, shipped inside it; Capacitor and the system WebView where GeckoView
# can't run; fully offline) and publishes it to the GitHub release for the newest version
# in src/changelog.js, e.g. v0.34. Pushes within one version replace that
# release's files; a new changelog entry makes a new release. Next to the APK:
# - latest.json: the APK and its native bridge level. The app offers an APK
#   update only when the native side changed (Updater.java).
# - the Unity testers' builds (Xbox, Linux / Steam Deck, Android), put there by scripts/unity-publish.sh when
#   each finishes; the notes' Unity section names their commits, from their labels, and is kept here.
# The game's own updates come from the game's site, published by cloudflare.yml
# (scripts/web-update.mjs); the repository is private, so nothing else is read here.
# The build number (versionCode) is the commit's (release-info.mjs build), the
# same as the Cloudflare web bundle's, so the app compares the two.
#
# When: after the unit suite passed on a push to main (tests.yml, "Tests": this workflow is triggered by its
# run finishing and goes on only when that run was a push to main here and succeeded), building that run's
# commit: SHA, github.event.workflow_run.head_sha (github.sha would be main's newest commit when this run
# started). By hand (workflow_dispatch, on main): after that commit's Tests gate passes. The author asked for
# the automatic build back on 2026-10-30, after it had been made manual-only (cb97e3eae).
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  statuses: write   # (scripts/commit-status.sh: "release: android" on the tested commit)

# A run is never cancelled once it started: cancelling one while it published left the newest
# release without its manifest (run 90 made v0.52 and was cancelled a second later, before its
# manifests went up). Pushes meanwhile wait; GitHub keeps
# only the newest one waiting.
# (Every run shares the one group; a run whose tests failed, or for another branch or event, is skipped by the
# job's `if` as soon as its turn comes.)
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  apk:
    # (the suite passed on a push to main in this repository, or a run by hand; else skipped)
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}   # the tested commit: built, and a new release's target
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0   # the whole history: the build number counts its commits

      - name: Require the selected main commit's test gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/wait-tests.sh "$SHA"

      # The outcome shows on the tested commit as "release: android" (pending now, success or failure at the
      # end): this workflow_run run's own check doesn't land on that commit, so a failed release went unseen
      - name: Commit status (pending)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/commit-status.sh pending "release: android"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # (cache: gradle keeps ~/.gradle/caches between runs, keyed on the Gradle files: GeckoView's
      # 90 MB AAR, pinned in android/variables.gradle, is downloaded once per version, not every push)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # GeckoView compiles against Android 17 (API 37.0); the runner's SDK may not have it yet
      - name: Android SDK
        id: sdk
        run: echo "home=$ANDROID_HOME" >> "$GITHUB_OUTPUT"
      - name: Android SDK platform 37 (cached)
        id: sdk37
        uses: actions/cache@v4
        with:
          path: ${{ steps.sdk.outputs.home }}/platforms/android-37.0
          key: android-platform-37.0-2
      - name: Install Android SDK platform 37
        if: steps.sdk37.outputs.cache-hit != 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      - name: Build the web game
        run: |
          npm ci
          npm run build

      - name: Release metadata
        id: meta
        run: |
          echo "version=$(node scripts/release-info.mjs version)" >> "$GITHUB_OUTPUT"
          echo "build=$(node scripts/release-info.mjs build)" >> "$GITHUB_OUTPUT"
          node scripts/release-info.mjs notes > "$RUNNER_TEMP/notes.md"

      - name: Copy the game into the Android project
        run: |
          # (the changelog's pictures and the reference sheets are the site's alone: a bundled game reads
          # them from the site; and the recorded themes but the desert's, which the game fetches from the
          # site the first time a world needs one and keeps: scripts/site-only.mjs)
          node scripts/site-only.mjs dist
          npx cap sync android

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.meta.outputs.version }}
          APP_VERSION_CODE: ${{ steps.meta.outputs.build }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/hiraeth-v${APP_VERSION_NAME}.apk"

      - name: The APK updater's manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build }}
        run: |
          # what the APK updater reads (android/.../Updater.java): this build's versionCode, its APK and native level.
          # (The game's own updates come from the game's site: cloudflare.yml, docs/cloudflare.md.)
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          node scripts/release-info.mjs latest-json "$BUILD" "$BASE/hiraeth-v$VERSION.apk" > "$RUNNER_TEMP/latest.json"
          cat "$RUNNER_TEMP/latest.json"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          TAG="v$VERSION"
          APK="$RUNNER_TEMP/hiraeth-v$VERSION.apk"
          LABEL="Hiraeth v$VERSION for Android (the game)"
          # retried on a transient error (scripts/retry.sh): v1.35's release was refused once, 403, and never made.
          # The whole publish is retried, so a release an earlier attempt made is updated, not made twice.
          . scripts/retry.sh
          publish() {
            # the file first, the manifest that points at it last
            # (the label is what the page shows: the release also holds the Unity testers' builds, unity-publish.sh)
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$APK#$LABEL" --clobber || return 1
              gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --clobber || return 1
              # (the notes' Unity section redone from the Unity builds the release holds: their labels name the commit)
              gh release view "$TAG" --json assets > "$RUNNER_TEMP/release.json" || return 1
              node scripts/release-info.mjs notes "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/notes.md" || return 1
              gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest || return 1
            else
              # (one call: gh keeps the release a draft until every file is up, so the newest
              # release never shows without its manifest)
              gh release create "$TAG" "$APK#$LABEL" "$RUNNER_TEMP/latest.json" --target "$SHA" --title "Hiraeth v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest || return 1
            fi
          }
          retry publish

      - uses: actions/upload-artifact@v5
        with:
          name: hiraeth-apk
          path: ${{ runner.temp }}/hiraeth-v${{ steps.meta.outputs.version }}.apk

      - name: Commit status (the outcome)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/commit-status.sh "${{ job.status }}" "release: android"
