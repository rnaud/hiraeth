name: Android release

# Every push to main builds a signed APK (the web game wrapped with Capacitor,
# fully offline) and publishes it to the GitHub release for the newest version
# in src/changelog.js, e.g. v0.34. Pushes within one version replace that
# release's files; a new changelog entry makes a new release. Next to the APK:
# - latest.json: the APK and its native bridge level. The app offers an APK
#   update only when the native side changed (Updater.java).
# - web-<build>.zip + web.json: the game itself (dist/), which the app downloads and
#   switches to by itself, without an APK (WebBundles.java).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A run is never cancelled once it started: cancelling one while it published left the newest
# release without its manifests, or with a new web zip under the old web.json (run 90 made v0.52
# and was cancelled a second later, before web.json went up). Pushes meanwhile wait; GitHub keeps
# only the newest one waiting.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build the web game
        run: |
          npm ci
          npm run build

      - name: Release metadata
        id: meta
        run: |
          echo "version=$(node scripts/release-info.mjs version)" >> "$GITHUB_OUTPUT"
          node scripts/release-info.mjs notes > "$RUNNER_TEMP/notes.md"

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.meta.outputs.version }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/moebius-v${APP_VERSION_NAME}.apk"

      - name: Web bundle
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ github.run_number }}
        run: |
          # the same dist/ as in the APK, for over-the-air updates (android/.../WebBundles.java);
          # one name per build, so a web.json always points at the zip it was made with
          (cd dist && zip -q -r -X "$RUNNER_TEMP/web-$BUILD.zip" .)
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          node scripts/release-info.mjs web-json "$BUILD" "$RUNNER_TEMP/web-$BUILD.zip" "$BASE/web-$BUILD.zip" > "$RUNNER_TEMP/web.json"
          # what the APK updater reads (android/.../Updater.java): this build's versionCode, its APK and native level
          node scripts/release-info.mjs latest-json "$BUILD" "$BASE/moebius-v$VERSION.apk" > "$RUNNER_TEMP/latest.json"
          cat "$RUNNER_TEMP/web.json" "$RUNNER_TEMP/latest.json"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ github.run_number }}
        run: |
          TAG="v$VERSION"
          APK="$RUNNER_TEMP/moebius-v$VERSION.apk"
          ZIP="$RUNNER_TEMP/web-$BUILD.zip"
          # the files first, the manifests that point at them last
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$ZIP" --clobber
            gh release upload "$TAG" "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/web.json" --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest
          else
            # (one call: gh keeps the release a draft until every file is up, so the newest
            # release never shows without its manifests)
            gh release create "$TAG" "$APK" "$ZIP" "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/web.json" --target "$GITHUB_SHA" --title "Memento v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest
          fi
          # older web zips of this release: keep the newest two (one may still be downloading)
          gh release view "$TAG" --json assets -q '.assets[].name' > "$RUNNER_TEMP/assets.txt"
          for old in $(node scripts/release-info.mjs web-zips $(cat "$RUNNER_TEMP/assets.txt")); do
            gh release delete-asset "$TAG" "$old" -y || true
          done

      - uses: actions/upload-artifact@v5
        with:
          name: moebius-apk
          path: ${{ runner.temp }}/moebius-v${{ steps.meta.outputs.version }}.apk
