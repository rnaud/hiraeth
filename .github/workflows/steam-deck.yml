name: Steam Deck release

# The offline game and its Linux runtime for the Steam Deck, published to the GitHub release `steam-deck`
# (a prerelease of its own; the runtime on the site comes from cloudflare.yml).
#
# When: after the unit suite passed on a push to main (tests.yml, "Tests": this workflow is triggered by its
# run finishing and goes on only when that run was a push to main here and succeeded), building that run's
# commit: SHA, github.event.workflow_run.head_sha (github.sha would be main's newest commit when this run
# started). By hand (workflow_dispatch): the chosen ref at once, without waiting for the tests.

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write   # (scripts/commit-status.sh: "release: steam deck" on the tested commit)

# (Only a run that will build takes the group: one whose tests failed, or a run for another branch or event, has
# a group of its own and is skipped, so it can't replace a waiting deploy or cancel a running one.)
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)) && 'steam-deck-release' || format('steam-deck-release-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  linux:
    # (the suite passed on a push to main in this repository, or a run by hand; else skipped)
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}   # the tested commit: built, and the release's target
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0   # the whole history: the packaged game's build number counts its commits
      # (the outcome on the tested commit, as android.yml's: pending now, success or failure at the end)
      - name: Commit status (pending)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/commit-status.sh pending "release: steam deck"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Test installer and updater
        run: python3 -m unittest discover -s tests -p 'test_steam_deck.py' -v

      - name: Build the offline game and Linux runtime
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: |
          npm ci
          npm --prefix desktop ci --ignore-scripts
          npm run build
          # the packaged game's number, on the scale of the content updates from the game's site
          # (deck.py, scripts/web-update.mjs), and the runtime package's (installed updaters compare
          # it): the commit's, as the Cloudflare deploy numbers the runtime it puts on the site
          # (scripts/deck-runtime.mjs); above the run-numbered packages before it (up to 189001)
          export WEB_BUILD=$(node scripts/release-info.mjs build)
          export DECK_BUILD=$((WEB_BUILD * 1000 + GITHUB_RUN_ATTEMPT))
          node scripts/package-steam-deck.mjs

      - name: Exercise the packaged game
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2
          # The hosted runner cannot provide Chromium's normal user sandbox.
          # Only this CI invocation disables it; installed games keep it enabled.
          MOEBIUS_SMOKE=1 timeout 150s xvfb-run -a output/steam-deck/moebius-linux-x64/moebius \
            --no-sandbox --use-angle=swiftshader --enable-unsafe-swiftshader

      - uses: actions/upload-artifact@v5
        with:
          name: moebius-steam-deck
          path: |
            output/steam-deck/*.tar.gz
            output/steam-deck/steam-deck.json
            output/steam-deck/install-moebius.py

      - name: Publish package, then advance the update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A separate channel avoids races with Android's version releases and
          # leaves GitHub's latest stable release pointing to the Android APK.
          # Each call retried on a transient error (scripts/retry.sh); the package's name is this build's
          # alone, so --clobber only replaces what an earlier attempt half-uploaded.
          . scripts/retry.sh
          if ! gh release view steam-deck >/dev/null 2>&1; then
            retry gh release create steam-deck --target "$SHA" --title 'Hiraeth for Steam Deck' \
              --prerelease --latest=false --notes-file scripts/steam-deck/release-notes.md \
              || gh release view steam-deck >/dev/null   # (made by an attempt that reported a failure: fine)
          fi
          retry gh release upload steam-deck output/steam-deck/*.tar.gz --clobber
          retry gh release upload steam-deck output/steam-deck/install-moebius.py --clobber
          retry gh release upload steam-deck output/steam-deck/steam-deck.json --clobber

      - name: Commit status (the outcome)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/commit-status.sh "${{ job.status }}" "release: steam deck"
