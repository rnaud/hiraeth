name: Steam Deck release

# The offline game and its Linux runtime, published to build-scoped `steam-deck-<build>` releases
# (a prerelease of its own; the runtime on the site comes from cloudflare.yml).
#
# When: explicitly dispatched on main, after the exact commit's Tests gate passes.
# Ordinary main pushes publish web/content updates without rebuilding this installer.

# Native installers are built only on explicit request; content updates use the web deploy.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  statuses: write   # (scripts/commit-status.sh: "release: steam deck" on the tested commit)

# (Only a run that will build takes the group: one whose tests failed, or a run for another branch or event, has
# a group of its own and is skipped, so it can't replace a waiting deploy or cancel a running one.)
concurrency:
  group: steam-deck-release
  cancel-in-progress: false

jobs:
  linux:
    # (the suite passed on a push to main in this repository, or a run by hand; else skipped)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      SHA: ${{ github.sha }}   # the tested commit: built, and the release's target
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0   # the whole history: the packaged game's build number counts its commits
      - name: Require the selected main commit's test gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/wait-tests.sh "$SHA"

      # (the outcome on the tested commit, as android.yml's: pending now, success or failure at the end)
      - name: Commit status (pending)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/commit-status.sh pending "release: steam deck"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Test installer and updater
        run: python3 -m unittest discover -s tests -p 'test_steam_deck.py' -v

      # (deck.py installs the Unity preview from the unity-linux release by its asset's digest: a warning
      # only, the package never carries the player)
      - name: The Unity preview's player on its release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          digest=$(gh api repos/${{ github.repository }}/releases/tags/unity-linux --jq '.assets[] | select(.name == "hiraeth-unity-linux.tar.gz") | .digest' || true)
          case "$digest" in sha256:*) echo "unity-linux: $digest" ;; *) echo "::warning::no hiraeth-unity-linux.tar.gz with a digest on the release unity-linux: the Deck's Unity preview won't install" ;; esac

      - name: Build the offline game and Linux runtime
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: |
          npm ci
          npm --prefix desktop ci --ignore-scripts
          npm run build
          # the packaged game's number, on the scale of the content updates from the game's site
          # (deck.py, scripts/web-update.mjs), and the runtime package's (installed updaters compare
          # it): the commit's, as the Cloudflare deploy numbers the runtime it puts on the site
          # (scripts/deck-runtime.mjs); above the run-numbered packages before it (up to 189001)
          WEB_BUILD=$(node scripts/release-info.mjs build)
          export WEB_BUILD
          export DECK_BUILD=$((WEB_BUILD * 1000 + GITHUB_RUN_ATTEMPT))
          node scripts/package-steam-deck.mjs

      - name: Exercise the packaged game
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2
          # The hosted runner cannot provide Chromium's normal user sandbox.
          # Only this CI invocation disables it; installed games keep it enabled.
          HIRAETH_SMOKE=1 timeout 150s xvfb-run -a output/steam-deck/hiraeth-linux-x64/hiraeth \
            --no-sandbox --use-angle=swiftshader --enable-unsafe-swiftshader

      - uses: actions/upload-artifact@v5
        with:
          name: hiraeth-steam-deck
          path: |
            output/steam-deck/*.tar.gz
            output/steam-deck/steam-deck.json
            output/steam-deck/install-hiraeth.py

      - name: Publish verified build-scoped package (preserve legacy feed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No clobber/deletion on the full legacy steam-deck release. Each retry
          # verifies existing draft bytes before publishing, never mutating a
          # published package. Cloudflare independently advances the stable site
          # multipart feed, which installed launchers already understand.
          . scripts/retry.sh
          retry node scripts/publish-steam-deck.mjs

      - name: Commit status (the outcome)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/commit-status.sh "${{ job.status }}" "release: steam deck"
