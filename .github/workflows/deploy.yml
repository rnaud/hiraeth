name: Deploy to GitHub Pages

# The game at https://rnaud.github.io/moebius/, a second home next to the Cloudflare
# Worker (cloudflare.yml). Only the site: the content updates for the app and the
# Deck (/updates/) come from the Worker alone.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # the changelog's pictures, which changelog.html reads from the site (as cloudflare.yml does)
      - run: cp -R changelog-media dist/changelog-media
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
