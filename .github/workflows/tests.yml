name: Tests

# Affected tests on exact push/PR ranges; explicit full runs for nightly and manual review.
# Keep the Tests name and push-main provenance: deployment listeners use both.
# Main pushes include changes since the last successful main push ancestor.
# Unproven history/API baseline falls back to full, never an empty selection.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete gameplay suite
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

# Pushes to main run one at a time, in push order, never cancelled once started: so their runs finish in
# order and the deploys (queued by their own concurrency groups) never ship an older commit after a newer one.
# GitHub keeps only the newest waiting run; a push replaced that way is cancelled, and a cancelled run deploys
# nothing (the newer one covers it). A pull request's newer push cancels its older run. (github.workflow is
# the caller's name when xbox.yml calls this file, so its calls never queue with, or replace, these runs.)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      files: ${{ steps.plan.outputs.files }}
      head: ${{ steps.plan.outputs.head }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: Resolve exact range and select tests
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FULL_SUITE: ${{ inputs.full || false }}
        run: node scripts/ci-test-plan.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: test-selection
          path: test-selection.json
          if-no-files-found: error
  unit:
    needs: selection
    name: unit (shard ${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.selection.outputs.head }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install the real MP3 decoder used by audio tests
        timeout-minutes: 4
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version
            exit 0
          fi
          . /etc/os-release
          test "$ID" = ubuntu
          [[ "$VERSION_CODENAME" =~ ^[a-z]+$ ]]
          test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg
          decoder_apt_dir=$(mktemp -d "$RUNNER_TEMP/hiraeth-decoder-apt.XXXXXX")
          chmod 755 "$decoder_apt_dir"
          mkdir -p "$decoder_apt_dir/lists/partial" "$decoder_apt_dir/archives/partial"
          # Explicit sources and fresh indexes exclude the runner's indirect Azure mirrorlist.
          printf '%s\n' \
            'Types: deb' 'URIs: https://archive.ubuntu.com/ubuntu' \
            "Suites: $VERSION_CODENAME $VERSION_CODENAME-updates" \
            'Components: main restricted universe multiverse' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' '' \
            'Types: deb' 'URIs: https://security.ubuntu.com/ubuntu' \
            "Suites: $VERSION_CODENAME-security" \
            'Components: main restricted universe multiverse' \
            'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' > "$decoder_apt_dir/ubuntu.sources"
          apt_options=(
            -o "Dir::Etc::sourcelist=$decoder_apt_dir/ubuntu.sources"
            -o 'Dir::Etc::sourceparts=-'
            -o "Dir::State::lists=$decoder_apt_dir/lists"
            -o "Dir::Cache::archives=$decoder_apt_dir/archives"
            -o 'Dir::Cache::pkgcache=' -o 'Dir::Cache::srcpkgcache='
            -o Acquire::Retries=1 -o Acquire::https::Timeout=15
            -o APT::Update::Error-Mode=any
          )
          sudo timeout -k 10s 60s apt-get "${apt_options[@]}" update
          sudo timeout -k 10s 150s apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg
          ffmpeg -version
      - run: npm ci
      - name: Run only the selected shard (empty is explicit)
        env:
          SELECTED_TESTS: ${{ needs.selection.outputs.files }}
        run: node scripts/run-test-shard.mjs ${{ matrix.shard }}/5 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/test-file-times.mjs --test-reporter-destination=stdout
