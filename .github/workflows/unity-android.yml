name: Unity release (testers)

# The Unity side of the engine bridge (docs/systems/engine-bridge.md: the web game's own JavaScript run in
# Puerts' V8 inside Unity, drawn by the C# port's ink look) built for testing on the devices, next to the
# players' builds (docs/systems/unity.md, "Building in GitHub Actions"):
# - android: the testers' APK (BridgeBuild.AndroidRelease): com.rnaud.memento.unity, "Hiraeth (Unity)", IL2CPP
#   ARM64, signed with the web app's release key, so it installs next to the app com.rnaud.moebius and each
#   build over the last; published to the GitHub release unity-android (memento-unity.apk, replaced each run);
# - linux: the bridge's Linux player (BridgeBuild.Linux -mono: x86_64, Vulkan) for the Steam Deck, to unity-linux.
# Both releases are prereleases, never the latest: the app's updater and the players read the vX.Y releases.
# Unity is licensed by GameCI (unity-builder v6, which activates a Personal seat from UNITY_EMAIL and
# UNITY_PASSWORD and returns it after); without those secrets the first job fails at once and says so.
# The same APK can be built and published from a Mac with scripts/unity-android-release.sh.
#
# When: a push that touches the Unity side (unity/, engine/, the bridge's scripts, this file), by hand, and
# every night, when the game (src/, public/) moved since the last published build: the game's pushes are too
# frequent to build each one. Fast when warm: Unity's Library (its imports, shader cache and the IL2CPP build's
# objects in Library/Bee), Puerts' IL2CPP glue, Gradle's caches and Puerts are all cached between runs, each
# under a key made of what it depends on: saved only when that changed, the entry it replaces then deleted
# (the repository's caches are limited to 10 GB: new entries every run pushed each other out).
# No unit suite here: these are testers' builds, not the players' (the players' deploys wait for tests.yml).

on:
  push:
    branches: [main]
    paths:
      - 'unity/**'
      - 'engine/**'
      - 'scripts/unity-*'
      - 'scripts/unity-*/**'
      - 'scripts/engine-bundle.mjs'
      - '.github/workflows/unity-android.yml'
  schedule:
    - cron: '17 3 * * *'   # (nightly; skipped when nothing the build takes changed since the last one)
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # (scripts/unity-ci-cache-prune.sh deletes the caches a new entry replaces)

# (one build at a time, never cancelled once started: a newer trigger waits, and GitHub keeps only the newest
# waiting one, cancelling those between: they would have built an older tree)
concurrency:
  group: unity-release
  cancel-in-progress: false

env:
  UNITY_VERSION: 6000.6.4f1   # (unity/Memento/ProjectSettings/ProjectVersion.txt: GameCI reads the version from there)
  PROJECT: unity/Memento

jobs:
  # the secrets first, in seconds, before the build; and whether a nightly run has anything new to build
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changed.outputs.build }}
    steps:
      - name: Unity licence and signing key
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          missing=""
          for s in UNITY_EMAIL UNITY_PASSWORD ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD; do
            eval "v=\${$s:-}"; [ -n "$v" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Missing repository secrets:$missing. Unity needs UNITY_EMAIL and UNITY_PASSWORD (the Unity account's sign-in, two-factor sign-in off; Unity Pro adds UNITY_SERIAL). See docs/systems/unity.md, 'Building in GitHub Actions'."
            exit 1
          fi
          echo "Unity licence (Personal from UNITY_EMAIL + UNITY_PASSWORD) and the release key are set"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Anything new since the last build?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          # (a push or a run by hand always builds; the nightly one only when the build's inputs moved)
          if [ "$EVENT" != schedule ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(gh release view unity-android --json body --jq .body | sed -n 's/.*Built from commit `\([0-9a-f]*\)`.*/\1/p' | head -1)
          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null \
            && git diff --quiet "$last" HEAD -- unity engine src public scripts .github/workflows/unity-android.yml; then
            echo "Nothing new since $last: no build tonight"; echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes since ${last:-the start}: building"; echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the whole history: the versionCode counts its commits (release-info.mjs build)

      # (the editor image, 8 GB, onto the runner's big temporary disk, pulled while the next steps run)
      - name: The editor image (pulled in the background)
        run: scripts/unity-ci-docker.sh start "unityci/editor:ubuntu-$UNITY_VERSION-android-3"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Puerts (cached)
        uses: actions/cache@v4
        with:
          path: .local-tools/puerts
          key: puerts-3.0.3

      - name: Puerts into the project, the game's JavaScript into StreamingAssets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci
          scripts/unity-js-setup.sh
          node scripts/engine-bundle.mjs unity

      # Unity's Library: the imported assets, the shader cache (12 minutes of shaders cold), the IL2CPP build's
      # objects (Library/Bee: 20 minutes of C++ cold, rebuilt only where the code changed). One entry, keyed on
      # what Unity imports and compiles (the project's committed Assets, its settings, its packages, Puerts' and
      # Unity's versions; not StreamingAssets, the game's JavaScript, nor the generated Assets/Gen): an exact hit
      # is not saved again; otherwise restored from the newest and, after the build, saved under the new key and
      # the older entry deleted. The IL2CPP symbol backups and stripped copies are left out (rebuilt in seconds).
      - name: Unity Library (restore)
        id: library
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PROJECT }}/Library
          key: unity-library-android-${{ env.UNITY_VERSION }}-puerts-3.0.3-${{ hashFiles('unity/Memento/Assets/**', 'unity/Memento/ProjectSettings/**', 'unity/Memento/Packages/manifest.json', '!unity/Memento/Assets/StreamingAssets/**', '!unity/Memento/Assets/Gen/**') }}
          restore-keys: |
            unity-library-android-

      # Gradle's downloads (the container's /root is the runner's home: GameCI mounts it), keyed on what picks
      # Gradle's plugins and libraries: Unity's version (its Gradle templates) and the packages
      - name: Gradle (restore)
        id: gradle
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: unity-gradle-${{ env.UNITY_VERSION }}-${{ hashFiles('unity/Memento/Packages/manifest.json', 'unity/Memento/Assets/Plugins/Android/**') }}
          restore-keys: unity-gradle-

      # Puerts' IL2CPP glue (Assets/Gen) depends on the project's C# (the bridges for its public signatures, its
      # extension methods), Puerts and Unity's il2cpp: made again only when they change. The key hashes the
      # committed C# only (Puerts sits in Packages/, its glue in Assets/Gen: neither is in it).
      - name: Puerts' IL2CPP glue (cached)
        id: glue
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PROJECT }}/Assets/Gen
            ${{ env.PROJECT }}/Assets/Gen.meta
          key: puerts-glue-3.0.3-${{ env.UNITY_VERSION }}-${{ hashFiles('unity/Memento/Assets/**/*.cs', 'unity/Memento/Assets/**/*.asmdef', 'unity/Memento/Packages/manifest.json', '!unity/Memento/Assets/Gen/**') }}

      - name: Version
        id: meta
        run: |
          echo "version=$(node scripts/release-info.mjs version)" >> "$GITHUB_OUTPUT"
          echo "build=$(node scripts/release-info.mjs build)" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .local-tools
          echo "$KEYSTORE_BASE64" | base64 -d > .local-tools/ci-release.p12

      - name: The editor image
        run: scripts/unity-ci-docker.sh wait

      # Puerts' IL2CPP glue in an editor run of its own: it is C# as well as C++ (skipped when cached)
      - name: Puerts' IL2CPP glue
        id: gluebuild
        if: steps.glue.outputs.cache-hit != 'true'
        continue-on-error: true   # (retried once below: an editor start is sometimes killed, exit 137)
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          GITHUB_TOKEN: ${{ github.token }}   # (unity-builder looks up the latest game-ci CLI with it: unsigned, the runner's shared IP ran out of GitHub's 60 calls an hour, 403)
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT }}
          buildMethod: Memento.EditorTools.BridgeBuild.Il2cpp
          versioning: None
          allowDirtyBuild: true

      - name: Puerts' IL2CPP glue (again)
        if: steps.gluebuild.outcome == 'failure'
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          GITHUB_TOKEN: ${{ github.token }}   # (unity-builder looks up the latest game-ci CLI with it: unsigned, the runner's shared IP ran out of GitHub's 60 calls an hour, 403)
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT }}
          buildMethod: Memento.EditorTools.BridgeBuild.Il2cpp
          versioning: None
          allowDirtyBuild: true

      - name: The testers' APK (IL2CPP ARM64)
        id: apk
        continue-on-error: true   # (retried once below: an editor start is sometimes killed, exit 137)
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          GITHUB_TOKEN: ${{ github.token }}   # (unity-builder looks up the latest game-ci CLI with it: unsigned, the runner's shared IP ran out of GitHub's 60 calls an hour, 403)
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT }}
          buildMethod: Memento.EditorTools.BridgeBuild.AndroidRelease
          versioning: Custom
          version: ${{ steps.meta.outputs.version }}
          androidVersionCode: ${{ steps.meta.outputs.build }}
          androidKeystoreName: ../../.local-tools/ci-release.p12
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          androidKeyaliasName: moebius
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          customParameters: -out Builds/unity-android/memento-unity.apk
          allowDirtyBuild: true

      - name: The testers' APK (IL2CPP ARM64) (again)
        id: apkagain
        if: steps.apk.outcome == 'failure'
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          GITHUB_TOKEN: ${{ github.token }}   # (unity-builder looks up the latest game-ci CLI with it: unsigned, the runner's shared IP ran out of GitHub's 60 calls an hour, 403)
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT }}
          buildMethod: Memento.EditorTools.BridgeBuild.AndroidRelease
          versioning: Custom
          version: ${{ steps.meta.outputs.version }}
          androidVersionCode: ${{ steps.meta.outputs.build }}
          androidKeystoreName: ../../.local-tools/ci-release.p12
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          androidKeyaliasName: moebius
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          customParameters: -out Builds/unity-android/memento-unity.apk
          allowDirtyBuild: true

      - name: Forget the key
        if: always()
        run: rm -f .local-tools/ci-release.p12

      # (saved only when its key moved; also when the build failed further on, as "-partial": what was imported
      # and compiled is not lost, and the next run with the same inputs, missing the exact key, saves it whole)
      - name: Unity Library (trim, and under which key)
        id: librarysave
        if: always() && steps.library.outcome == 'success' && steps.library.outputs.cache-hit != 'true'
        env:
          KEY: ${{ steps.library.outputs.cache-primary-key }}
          BUILT: ${{ steps.apk.outcome == 'success' || steps.apkagain.outcome == 'success' }}
        run: |
          sudo rm -rf "$PROJECT/Library/Bee/Android/Prj/IL2CPP/Il2CppBackup" "$PROJECT"/Library/Bee/artifacts/objcopy_*
          if [ "$BUILT" = true ]; then echo "key=$KEY"; else echo "key=$KEY-partial"; fi >> "$GITHUB_OUTPUT"

      - name: Unity Library (save)
        if: always() && steps.librarysave.outputs.key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PROJECT }}/Library
          key: ${{ steps.librarysave.outputs.key }}

      - name: Unity Library (the older entries deleted)
        if: always() && steps.librarysave.outputs.key != ''
        continue-on-error: true   # (housekeeping: a prune that fails never fails the build)
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.librarysave.outputs.key }}
        run: scripts/unity-ci-cache-prune.sh unity-library-android- "$KEY"

      # (Gradle's downloads saved when their key moved and the APK was built: Gradle ran to its end)
      - name: Gradle (save)
        id: gradlesave
        if: always() && steps.gradle.outcome == 'success' && steps.gradle.outputs.cache-hit != 'true' && (steps.apk.outcome == 'success' || steps.apkagain.outcome == 'success')
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle.outputs.cache-primary-key }}

      - name: Gradle (the older entries deleted)
        if: always() && steps.gradlesave.outcome == 'success'
        continue-on-error: true   # (housekeeping: a prune that fails never fails the build)
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.gradle.outputs.cache-primary-key }}
        run: scripts/unity-ci-cache-prune.sh unity-gradle- "$KEY"

      # (kept with the run too: a week, in case the release can't be written)
      - uses: actions/upload-artifact@v5
        with:
          name: memento-unity-apk
          path: ${{ env.PROJECT }}/Builds/unity-android/memento-unity.apk
          retention-days: 7

      - name: Publish to the release unity-android
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: scripts/unity-publish.sh android "$PROJECT/Builds/unity-android/memento-unity.apk" "GitHub Actions (run ${{ github.run_number }})"

  linux:
    # (after the APK, not beside it: one Personal seat held at a time; also when the APK failed)
    needs: [check, android]
    if: always() && needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # (the runner's root disk alone was too small for the editor image: "no space left on device" pulling it)
      - name: The editor image (pulled in the background)
        run: scripts/unity-ci-docker.sh start "unityci/editor:ubuntu-$UNITY_VERSION-linux-il2cpp-3"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Puerts (cached)
        uses: actions/cache@v4
        with:
          path: .local-tools/puerts
          key: puerts-3.0.3

      - name: Puerts into the project, the game's JavaScript into StreamingAssets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci
          scripts/unity-js-setup.sh
          node scripts/engine-bundle.mjs unity

      # (as the APK's: one entry, saved when its key moved, the older one deleted)
      - name: Unity Library (restore)
        id: library
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PROJECT }}/Library
          key: unity-library-linux-${{ env.UNITY_VERSION }}-puerts-3.0.3-${{ hashFiles('unity/Memento/Assets/**', 'unity/Memento/ProjectSettings/**', 'unity/Memento/Packages/manifest.json', '!unity/Memento/Assets/StreamingAssets/**', '!unity/Memento/Assets/Gen/**') }}
          restore-keys: |
            unity-library-linux-

      # Puerts checks for its IL2CPP glue in every build, Mono too ("Required file 'Puerts_il2cpp.cpp' not
      # found"): the APK's, from the cache, else made here
      - name: Puerts' IL2CPP glue (cached)
        id: glue
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PROJECT }}/Assets/Gen
            ${{ env.PROJECT }}/Assets/Gen.meta
          key: puerts-glue-3.0.3-${{ env.UNITY_VERSION }}-${{ hashFiles('unity/Memento/Assets/**/*.cs', 'unity/Memento/Assets/**/*.asmdef', 'unity/Memento/Packages/manifest.json', '!unity/Memento/Assets/Gen/**') }}

      - name: The editor image
        run: scripts/unity-ci-docker.sh wait

      - name: Puerts' IL2CPP glue
        id: gluebuild
        if: steps.glue.outputs.cache-hit != 'true'
        continue-on-error: true   # (retried once below: an editor start is sometimes killed, exit 137)
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          GITHUB_TOKEN: ${{ github.token }}   # (unity-builder looks up the latest game-ci CLI with it: unsigned, the runner's shared IP ran out of GitHub's 60 calls an hour, 403)
        with:
          targetPlatform: StandaloneLinux64
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT }}
          buildMethod: Memento.EditorTools.BridgeBuild.Il2cpp
          versioning: None
          allowDirtyBuild: true

      # (Mono, the Deck's player as the docs build it)

      - name: Puerts' IL2CPP glue (again)
        if: steps.gluebuild.outcome == 'failure'
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          GITHUB_TOKEN: ${{ github.token }}   # (unity-builder looks up the latest game-ci CLI with it: unsigned, the runner's shared IP ran out of GitHub's 60 calls an hour, 403)
        with:
          targetPlatform: StandaloneLinux64
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT }}
          buildMethod: Memento.EditorTools.BridgeBuild.Il2cpp
          versioning: None
          allowDirtyBuild: true

      # (Mono, the Deck's player as the docs build it)
      - name: The Linux player (x86_64, Vulkan, Mono)
        id: player
        continue-on-error: true   # (retried once below: an editor start is sometimes killed, exit 137)
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          GITHUB_TOKEN: ${{ github.token }}   # (unity-builder looks up the latest game-ci CLI with it: unsigned, the runner's shared IP ran out of GitHub's 60 calls an hour, 403)
        with:
          targetPlatform: StandaloneLinux64
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT }}
          buildMethod: Memento.EditorTools.BridgeBuild.Linux
          versioning: None
          customParameters: -mono -out Builds/bridge-linux/memento-js.x86_64
          allowDirtyBuild: true

      - name: The Linux player (x86_64, Vulkan, Mono) (again)
        id: playeragain
        if: steps.player.outcome == 'failure'
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          GITHUB_TOKEN: ${{ github.token }}   # (unity-builder looks up the latest game-ci CLI with it: unsigned, the runner's shared IP ran out of GitHub's 60 calls an hour, 403)
        with:
          targetPlatform: StandaloneLinux64
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT }}
          buildMethod: Memento.EditorTools.BridgeBuild.Linux
          versioning: None
          customParameters: -mono -out Builds/bridge-linux/memento-js.x86_64
          allowDirtyBuild: true

      - name: Unity Library (under which key)
        id: librarysave
        if: always() && steps.library.outcome == 'success' && steps.library.outputs.cache-hit != 'true'
        env:
          KEY: ${{ steps.library.outputs.cache-primary-key }}
          BUILT: ${{ steps.player.outcome == 'success' || steps.playeragain.outcome == 'success' }}
        run: if [ "$BUILT" = true ]; then echo "key=$KEY"; else echo "key=$KEY-partial"; fi >> "$GITHUB_OUTPUT"

      - name: Unity Library (save)
        if: always() && steps.librarysave.outputs.key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PROJECT }}/Library
          key: ${{ steps.librarysave.outputs.key }}

      - name: Unity Library (the older entries deleted)
        if: always() && steps.librarysave.outputs.key != ''
        continue-on-error: true   # (housekeeping: a prune that fails never fails the build)
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.librarysave.outputs.key }}
        run: scripts/unity-ci-cache-prune.sh unity-library-linux- "$KEY"

      - name: Publish to the release unity-linux
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          tar czf "$RUNNER_TEMP/memento-unity-linux.tar.gz" -C "$PROJECT/Builds" bridge-linux
          ls -l "$RUNNER_TEMP/memento-unity-linux.tar.gz"
          scripts/unity-publish.sh linux "$RUNNER_TEMP/memento-unity-linux.tar.gz" "GitHub Actions (run ${{ github.run_number }})"
