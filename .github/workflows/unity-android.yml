name: Unity release (testers)

# The Unity side of the engine bridge (docs/systems/engine-bridge.md: the web game's own JavaScript run in
# Puerts' V8 inside Unity, drawn by the C# port's ink look) built for testing on the devices, next to the
# players' builds (docs/systems/unity.md, "Building in GitHub Actions"):
# - android: the testers' APK (BridgeBuild.AndroidRelease): com.rnaud.hiraeth.unity, "Hiraeth (Unity)", IL2CPP
#   ARM64, signed with the web app's release key, so it installs next to the app com.rnaud.hiraeth and each
#   build over the last; published to the GitHub release unity-android (hiraeth-unity.apk, replaced each run);
# - linux: the bridge's Linux player (BridgeBuild.Linux: x86_64, IL2CPP, Vulkan) for the Steam Deck, to unity-linux.
# Both releases are prereleases, never the latest: the app's updater and the players read the vX.Y releases.
# Each build also goes onto its built version's release (vX.Y) beside the APK, labelled with the commit built
# (scripts/unity-publish.sh): the prereleases stay what the Deck's installer reads.
# Unity is licensed by GameCI (unity-builder v6, which activates a Personal seat from UNITY_EMAIL and
# UNITY_PASSWORD and returns it after); without those secrets the first job fails at once and says so.
# The same APK can be built and published from a Mac with scripts/unity-android-release.sh.
#
# When: manually requested, or daily if relevant inputs changed since the last successful native build.
# Fast when warm: Unity's Library (its imports, shader cache and the IL2CPP build's
# objects in Library/Bee), Puerts' IL2CPP glue, Gradle's caches and Puerts are all cached between runs, each
# under a key made of what it depends on: saved only when that changed, the entry it replaces then deleted
# (the repository's caches are limited to 10 GB: new entries every run pushed each other out).
# Both native players publish only after tests.yml passes on their exact commit (scripts/wait-tests.sh).

# Native builds are independent of each web release; unchanged daily runs skip them.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      linux:
        description: "On a branch, build the Linux player too (main always does; a branch publishes nothing)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # (scripts/unity-ci-cache-prune.sh deletes the caches a new entry replaces)

# (one build at a time, never cancelled once started: a newer trigger waits, and GitHub keeps only the newest
# waiting one, cancelling those between: they would have built an older tree)
concurrency:
  group: unity-release
  cancel-in-progress: false

env:
  UNITY_VERSION: 6000.6.4f1   # (unity/Hiraeth/ProjectSettings/ProjectVersion.txt: GameCI reads the version from there)
  PROJECT: unity/Hiraeth

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Compare with the last successful native build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/unity-release-plan.mjs

  # Check secrets only when a build is needed.
  check:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Unity licence and signing key
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          missing=""
          for s in UNITY_EMAIL UNITY_PASSWORD ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD; do
            eval "v=\${$s:-}"; [ -n "$v" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Missing repository secrets:$missing. Unity needs UNITY_EMAIL and UNITY_PASSWORD (the Unity account's sign-in, two-factor sign-in off; Unity Pro adds UNITY_SERIAL). See docs/systems/unity.md, 'Building in GitHub Actions'."
            exit 1
          fi
          echo "Unity licence (Personal from UNITY_EMAIL + UNITY_PASSWORD) and the release key are set"


  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the whole history: the versionCode counts its commits (release-info.mjs build)

      # (the editor image, 8 GB, onto the runner's big temporary disk, pulled while the next steps run)
      - name: The editor image (pulled in the background)
        run: scripts/unity-ci-docker.sh start "unityci/editor:ubuntu-$UNITY_VERSION-android-3"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Puerts (cached)
        uses: actions/cache@v4
        with:
          path: .local-tools/puerts
          key: puerts-3.0.3

      - name: Configure GameAnalytics SDK ingestion keys
        env:
          GAMEANALYTICS_ANDROID_GAME_KEY: ${{ secrets.GAMEANALYTICS_ANDROID_GAME_KEY }}
          GAMEANALYTICS_ANDROID_SECRET_KEY: ${{ secrets.GAMEANALYTICS_ANDROID_SECRET_KEY }}
          GAMEANALYTICS_LINUX_GAME_KEY: ${{ secrets.GAMEANALYTICS_LINUX_GAME_KEY }}
          GAMEANALYTICS_LINUX_SECRET_KEY: ${{ secrets.GAMEANALYTICS_LINUX_SECRET_KEY }}
        run: node scripts/gameanalytics-config.mjs

      - name: Puerts into the project, the game's JavaScript into StreamingAssets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci
          scripts/unity-js-setup.sh
          node scripts/engine-bundle.mjs unity

      # Unity's Library: the imported assets, the shader cache (12 minutes of shaders cold), the IL2CPP build's
      # objects (Library/Bee: 20 minutes of C++ cold, rebuilt only where the code changed). One entry, keyed on
      # what Unity imports and compiles (the project's committed Assets, its settings, its packages, Puerts' and
      # Unity's versions; not StreamingAssets, the game's JavaScript, nor the generated Assets/Gen): an exact hit
      # is not saved again; otherwise restored from the newest and, after the build, saved under the new key and
      # the older entry deleted. The IL2CPP symbol backups and stripped copies are left out (rebuilt in seconds).
      - name: Unity Library (restore)
        id: library
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PROJECT }}/Library
          key: unity-library-android-${{ env.UNITY_VERSION }}-puerts-3.0.3-${{ hashFiles('unity/Hiraeth/Assets/**', 'unity/Hiraeth/ProjectSettings/**', 'unity/Hiraeth/Packages/manifest.json', '!unity/Hiraeth/Assets/StreamingAssets/**', '!unity/Hiraeth/Assets/Gen/**') }}
          restore-keys: |
            unity-library-android-

      # Gradle's downloads (the container's /root is the runner's home: GameCI mounts it), keyed on what picks
      # Gradle's plugins and libraries: Unity's version (its Gradle templates) and the packages
      - name: Gradle (restore)
        id: gradle
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: unity-gradle-${{ env.UNITY_VERSION }}-${{ hashFiles('unity/Hiraeth/Packages/manifest.json', 'unity/Hiraeth/Assets/Plugins/Android/**') }}
          restore-keys: unity-gradle-

      # Puerts' IL2CPP glue (Assets/Gen) depends on the project's C# (the bridges for its public signatures, its
      # extension methods), Puerts and Unity's il2cpp: made again only when they change. The key hashes the
      # committed C# only (Puerts sits in Packages/, its glue in Assets/Gen: neither is in it).
      - name: Puerts' IL2CPP glue (cached)
        id: glue
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PROJECT }}/Assets/Gen
            ${{ env.PROJECT }}/Assets/Gen.meta
          key: puerts-glue-3.0.3-${{ env.UNITY_VERSION }}-${{ hashFiles('unity/Hiraeth/Assets/**/*.cs', 'unity/Hiraeth/Assets/**/*.asmdef', 'unity/Hiraeth/Packages/manifest.json', '!unity/Hiraeth/Assets/Gen/**') }}

      - name: Version
        id: meta
        run: |
          echo "version=$(node scripts/release-info.mjs version)" >> "$GITHUB_OUTPUT"
          echo "build=$(node scripts/release-info.mjs build)" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .local-tools
          echo "$KEYSTORE_BASE64" | base64 -d > .local-tools/ci-release.p12

      - name: The editor image
        run: scripts/unity-ci-docker.sh wait

      # Puerts' IL2CPP glue in an editor run of its own: it is C# as well as C++ (skipped when cached)
      - name: Puerts' IL2CPP glue
        id: gluebuild
        if: steps.glue.outputs.cache-hit != 'true'
        continue-on-error: true   # (retried once below: an editor start is sometimes killed, exit 137)
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          GITHUB_TOKEN: ${{ github.token }}   # (unity-builder looks up the latest game-ci CLI with it: unsigned, the runner's shared IP ran out of GitHub's 60 calls an hour, 403)
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT }}
          buildMethod: Hiraeth.EditorTools.BridgeBuild.Il2cpp
          versioning: None
          allowDirtyBuild: true

      # (a second start is killed too, now and then: 4 of the 45 runs before #290 failed so, a third start passes)
      - name: Puerts' IL2CPP glue (again)
        id: gluebuildagain
        if: steps.gluebuild.outcome == 'failure'
        continue-on-error: true   # (and a third time below)
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          GITHUB_TOKEN: ${{ github.token }}   # (unity-builder looks up the latest game-ci CLI with it: unsigned, the runner's shared IP ran out of GitHub's 60 calls an hour, 403)
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT }}
          buildMethod: Hiraeth.EditorTools.BridgeBuild.Il2cpp
          versioning: None
          allowDirtyBuild: true

      - name: Puerts' IL2CPP glue (a third time)
        if: steps.gluebuildagain.outcome == 'failure'
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          GITHUB_TOKEN: ${{ github.token }}   # (unity-builder looks up the latest game-ci CLI with it: unsigned, the runner's shared IP ran out of GitHub's 60 calls an hour, 403)
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT }}
          buildMethod: Hiraeth.EditorTools.BridgeBuild.Il2cpp
          versioning: None
          allowDirtyBuild: true

      - name: The testers' APK (IL2CPP ARM64)
        id: apk
        continue-on-error: true   # (retried below: an editor start is sometimes killed, exit 137)
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          GITHUB_TOKEN: ${{ github.token }}   # (unity-builder looks up the latest game-ci CLI with it: unsigned, the runner's shared IP ran out of GitHub's 60 calls an hour, 403)
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT }}
          buildMethod: Hiraeth.EditorTools.BridgeBuild.AndroidRelease
          versioning: Custom
          version: ${{ steps.meta.outputs.version }}
          androidVersionCode: ${{ steps.meta.outputs.build }}
          androidKeystoreName: ../../.local-tools/ci-release.p12
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          androidKeyaliasName: moebius
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          customParameters: -out Builds/unity-android/hiraeth-unity.apk
          allowDirtyBuild: true

      - name: The testers' APK (IL2CPP ARM64) (again)
        id: apkagain
        if: steps.apk.outcome == 'failure'
        continue-on-error: true   # (and a third time below)
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          GITHUB_TOKEN: ${{ github.token }}   # (unity-builder looks up the latest game-ci CLI with it: unsigned, the runner's shared IP ran out of GitHub's 60 calls an hour, 403)
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT }}
          buildMethod: Hiraeth.EditorTools.BridgeBuild.AndroidRelease
          versioning: Custom
          version: ${{ steps.meta.outputs.version }}
          androidVersionCode: ${{ steps.meta.outputs.build }}
          androidKeystoreName: ../../.local-tools/ci-release.p12
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          androidKeyaliasName: moebius
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          customParameters: -out Builds/unity-android/hiraeth-unity.apk
          allowDirtyBuild: true

      - name: The testers' APK (IL2CPP ARM64) (a third time)
        id: apkthird
        if: steps.apkagain.outcome == 'failure'
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          GITHUB_TOKEN: ${{ github.token }}   # (unity-builder looks up the latest game-ci CLI with it: unsigned, the runner's shared IP ran out of GitHub's 60 calls an hour, 403)
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT }}
          buildMethod: Hiraeth.EditorTools.BridgeBuild.AndroidRelease
          versioning: Custom
          version: ${{ steps.meta.outputs.version }}
          androidVersionCode: ${{ steps.meta.outputs.build }}
          androidKeystoreName: ../../.local-tools/ci-release.p12
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          androidKeyaliasName: moebius
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          customParameters: -out Builds/unity-android/hiraeth-unity.apk
          allowDirtyBuild: true

      - name: Forget the key
        if: always()
        run: rm -f .local-tools/ci-release.p12

      # (what kills a start is not known yet; not the kernel's out-of-memory killer in run 38525814587)
      - name: Why an editor start was killed (the kernel's log)
        if: always() && (steps.gluebuild.outcome == 'failure' || steps.apk.outcome == 'failure')
        continue-on-error: true
        run: |
          oom=$(sudo dmesg -T | grep -i -E 'out of memory|oom-kill|killed process' | tail -20)
          [ -n "$oom" ] && echo "$oom" || echo "no out-of-memory kill in the kernel log"; sudo dmesg -T | tail -15; free -m

      # (saved only when its key moved; also when the build failed further on, as "-partial": what was imported
      # and compiled is not lost, and the next run with the same inputs, missing the exact key, saves it whole)
      - name: Unity Library (trim, and under which key)
        id: librarysave
        if: always() && steps.library.outcome == 'success' && steps.library.outputs.cache-hit != 'true'
        env:
          KEY: ${{ steps.library.outputs.cache-primary-key }}
          BUILT: ${{ steps.apk.outcome == 'success' || steps.apkagain.outcome == 'success' || steps.apkthird.outcome == 'success' }}
        run: |
          sudo rm -rf "$PROJECT/Library/Bee/Android/Prj/IL2CPP/Il2CppBackup" "$PROJECT"/Library/Bee/artifacts/objcopy_*
          if [ "$BUILT" = true ]; then echo "key=$KEY"; else echo "key=$KEY-partial"; fi >> "$GITHUB_OUTPUT"

      - name: Unity Library (save)
        if: always() && steps.librarysave.outputs.key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PROJECT }}/Library
          key: ${{ steps.librarysave.outputs.key }}

      - name: Unity Library (the older entries deleted)
        if: always() && steps.librarysave.outputs.key != ''
        continue-on-error: true   # (housekeeping: a prune that fails never fails the build)
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.librarysave.outputs.key }}
        run: scripts/unity-ci-cache-prune.sh unity-library-android- "$KEY"

      # (Gradle's downloads saved when their key moved and the APK was built: Gradle ran to its end)
      - name: Gradle (save)
        id: gradlesave
        if: always() && steps.gradle.outcome == 'success' && steps.gradle.outputs.cache-hit != 'true' && (steps.apk.outcome == 'success' || steps.apkagain.outcome == 'success' || steps.apkthird.outcome == 'success')
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle.outputs.cache-primary-key }}

      - name: Gradle (the older entries deleted)
        if: always() && steps.gradlesave.outcome == 'success'
        continue-on-error: true   # (housekeeping: a prune that fails never fails the build)
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.gradle.outputs.cache-primary-key }}
        run: scripts/unity-ci-cache-prune.sh unity-gradle- "$KEY"

      # (kept with the run too: a week, in case the release can't be written)
      - uses: actions/upload-artifact@v5
        with:
          name: hiraeth-unity-apk
          path: ${{ env.PROJECT }}/Builds/unity-android/hiraeth-unity.apk
          retention-days: 7

      # (main only: a branch run by hand (gh workflow run --ref) leaves the testers' release alone, its APK in the artifact)
      - name: The unit suite passed on this commit (tests.yml)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/wait-tests.sh "${{ github.sha }}" 90

      - name: Publish to the release unity-android
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: scripts/unity-publish.sh android "$PROJECT/Builds/unity-android/hiraeth-unity.apk" "GitHub Actions (run ${{ github.run_number }})"

  linux:
    # (after the APK, not beside it: one Personal seat held at a time; also when the APK failed)
    needs: [check, android]
    # (and only on main: a branch's run by hand builds the APK alone, unless asked for the Linux player too)
    if: always() && needs.check.result == 'success' && (github.ref == 'refs/heads/main' || inputs.linux)
    runs-on: ubuntu-latest
    timeout-minutes: 150   # (the build, its smoke run on the CPU and the wait for the unit suite)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # (the runner's root disk alone was too small for the editor image: "no space left on device" pulling it)
      - name: The editor image (pulled in the background)
        run: scripts/unity-ci-docker.sh start "unityci/editor:ubuntu-$UNITY_VERSION-linux-il2cpp-3"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Puerts (cached)
        uses: actions/cache@v4
        with:
          path: .local-tools/puerts
          key: puerts-3.0.3

      - name: Configure GameAnalytics SDK ingestion keys
        env:
          GAMEANALYTICS_ANDROID_GAME_KEY: ${{ secrets.GAMEANALYTICS_ANDROID_GAME_KEY }}
          GAMEANALYTICS_ANDROID_SECRET_KEY: ${{ secrets.GAMEANALYTICS_ANDROID_SECRET_KEY }}
          GAMEANALYTICS_LINUX_GAME_KEY: ${{ secrets.GAMEANALYTICS_LINUX_GAME_KEY }}
          GAMEANALYTICS_LINUX_SECRET_KEY: ${{ secrets.GAMEANALYTICS_LINUX_SECRET_KEY }}
        run: node scripts/gameanalytics-config.mjs

      - name: Puerts into the project, the game's JavaScript into StreamingAssets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci
          scripts/unity-js-setup.sh
          node scripts/engine-bundle.mjs unity

      # (as the APK's: one entry, saved when its key moved, the older one deleted)
      - name: Unity Library (restore)
        id: library
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PROJECT }}/Library
          key: unity-library-linux-${{ env.UNITY_VERSION }}-puerts-3.0.3-${{ hashFiles('unity/Hiraeth/Assets/**', 'unity/Hiraeth/ProjectSettings/**', 'unity/Hiraeth/Packages/manifest.json', '!unity/Hiraeth/Assets/StreamingAssets/**', '!unity/Hiraeth/Assets/Gen/**') }}
          restore-keys: |
            unity-library-linux-

      # Puerts checks for its IL2CPP glue in every build, Mono too ("Required file 'Puerts_il2cpp.cpp' not
      # found"): the APK's, from the cache, else made here
      - name: Puerts' IL2CPP glue (cached)
        id: glue
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PROJECT }}/Assets/Gen
            ${{ env.PROJECT }}/Assets/Gen.meta
          key: puerts-glue-3.0.3-${{ env.UNITY_VERSION }}-${{ hashFiles('unity/Hiraeth/Assets/**/*.cs', 'unity/Hiraeth/Assets/**/*.asmdef', 'unity/Hiraeth/Packages/manifest.json', '!unity/Hiraeth/Assets/Gen/**') }}

      - name: The editor image
        run: scripts/unity-ci-docker.sh wait

      - name: Puerts' IL2CPP glue
        id: gluebuild
        if: steps.glue.outputs.cache-hit != 'true'
        continue-on-error: true   # (retried once below: an editor start is sometimes killed, exit 137)
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          GITHUB_TOKEN: ${{ github.token }}   # (unity-builder looks up the latest game-ci CLI with it: unsigned, the runner's shared IP ran out of GitHub's 60 calls an hour, 403)
        with:
          targetPlatform: StandaloneLinux64
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT }}
          buildMethod: Hiraeth.EditorTools.BridgeBuild.Il2cpp
          versioning: None
          allowDirtyBuild: true

      - name: Puerts' IL2CPP glue (again)
        if: steps.gluebuild.outcome == 'failure'
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          GITHUB_TOKEN: ${{ github.token }}   # (unity-builder looks up the latest game-ci CLI with it: unsigned, the runner's shared IP ran out of GitHub's 60 calls an hour, 403)
        with:
          targetPlatform: StandaloneLinux64
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT }}
          buildMethod: Hiraeth.EditorTools.BridgeBuild.Il2cpp
          versioning: None
          allowDirtyBuild: true

      # (IL2CPP's Linux build wants Unity's Linux sysroot and its compiler, a package: added for this build only, after
      # the Library's key was taken; on a Mac, com.unity.toolchain.macos-arm64-linux and com.unity.sysroot.linux-x86_64)
      - name: The Linux sysroot (IL2CPP)
        run: |
          jq '.dependencies["com.unity.toolchain.linux-x86_64"] = "2.0.11"' "$PROJECT/Packages/manifest.json" > "$RUNNER_TEMP/manifest.json"
          cp "$RUNNER_TEMP/manifest.json" "$PROJECT/Packages/manifest.json"

      # (IL2CPP, as the Mac, the APK and the Xbox: the Mono player never ran, Puerts' start there could not call System.Type's
      # GetNestedTypes, stripped most likely; docs/systems/performance.md "The Steam Deck, round 6")
      - name: The Linux player (x86_64, Vulkan, IL2CPP)
        id: player
        continue-on-error: true   # (retried once below: an editor start is sometimes killed, exit 137)
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          GITHUB_TOKEN: ${{ github.token }}   # (unity-builder looks up the latest game-ci CLI with it: unsigned, the runner's shared IP ran out of GitHub's 60 calls an hour, 403)
        with:
          targetPlatform: StandaloneLinux64
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT }}
          buildMethod: Hiraeth.EditorTools.BridgeBuild.Linux
          versioning: None
          customParameters: -out Builds/bridge-linux/hiraeth-js.x86_64
          allowDirtyBuild: true

      # (the retry on the same Library: the start killed at once, exit 137, is not the Library's doing, and the
      # second start passes as the APK's does, in 2-3 minutes; starting it from no Library, as until #290, imported
      # and compiled everything again, 15-28 minutes, in nearly half the runs)
      - name: The Linux player (x86_64, Vulkan, IL2CPP) (again)
        id: playeragain
        if: steps.player.outcome == 'failure'
        continue-on-error: true   # (a last try below, from no Library)
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          GITHUB_TOKEN: ${{ github.token }}   # (unity-builder looks up the latest game-ci CLI with it: unsigned, the runner's shared IP ran out of GitHub's 60 calls an hour, 403)
        with:
          targetPlatform: StandaloneLinux64
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT }}
          buildMethod: Hiraeth.EditorTools.BridgeBuild.Linux
          versioning: None
          customParameters: -out Builds/bridge-linux/hiraeth-js.x86_64
          allowDirtyBuild: true

      # (the last try starts from no Library, imports it again, and that one is saved in its place: in the Mono player's
      # days, from run 38151565992 on, every start on the Library a built run had saved was killed, in both attempts)
      - name: Unity Library (none, for the last try)
        if: steps.playeragain.outcome == 'failure'
        run: sudo rm -rf "$PROJECT/Library"

      - name: The Linux player (x86_64, Vulkan, IL2CPP) (from no Library)
        id: playerfresh
        if: steps.playeragain.outcome == 'failure'
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          GITHUB_TOKEN: ${{ github.token }}   # (unity-builder looks up the latest game-ci CLI with it: unsigned, the runner's shared IP ran out of GitHub's 60 calls an hour, 403)
        with:
          targetPlatform: StandaloneLinux64
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT }}
          buildMethod: Hiraeth.EditorTools.BridgeBuild.Linux
          versioning: None
          customParameters: -out Builds/bridge-linux/hiraeth-js.x86_64
          allowDirtyBuild: true

      # (what kills a start is not known yet; not the kernel's out-of-memory killer in run 38525814587)
      - name: Why an editor start was killed (the kernel's log)
        if: always() && steps.player.outcome == 'failure'
        continue-on-error: true
        run: |
          oom=$(sudo dmesg -T | grep -i -E 'out of memory|oom-kill|killed process' | tail -20)
          [ -n "$oom" ] && echo "$oom" || echo "no out-of-memory kill in the kernel log"; sudo dmesg -T | tail -15; free -m

      - name: Unity Library (under which key)
        id: librarysave
        if: always() && steps.library.outcome == 'success' && steps.library.outputs.cache-hit != 'true' || always() && steps.library.outcome == 'success' && steps.playerfresh.outcome == 'success'
        # (and after the last try from no Library, whatever was restored: the fresh one under a key of its own, the
        # older entries, the one whose starts were killed among them, deleted below)
        env:
          KEY: ${{ steps.library.outputs.cache-primary-key }}
          BUILT: ${{ steps.player.outcome == 'success' || steps.playeragain.outcome == 'success' || steps.playerfresh.outcome == 'success' }}
          FRESH: ${{ steps.playerfresh.outcome == 'success' && '-fresh' || '' }}
        run: if [ "$BUILT" = true ]; then echo "key=$KEY$FRESH"; else echo "key=$KEY-partial"; fi >> "$GITHUB_OUTPUT"

      - name: Unity Library (save)
        if: always() && steps.librarysave.outputs.key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PROJECT }}/Library
          key: ${{ steps.librarysave.outputs.key }}

      - name: Unity Library (the older entries deleted)
        if: always() && steps.librarysave.outputs.key != ''
        continue-on-error: true   # (housekeeping: a prune that fails never fails the build)
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.librarysave.outputs.key }}
        run: scripts/unity-ci-cache-prune.sh unity-library-linux- "$KEY"

      # (gzip on every core, pigz: the same .tar.gz the Deck's installer reads, in seconds instead of 35. Without the
      # build's own leftovers, which the Deck's installer never unpacks (scripts/steam-deck/deck.py UNITY_SKIP): IL2CPP's
      # C++ and GameAssembly's symbols were 950 of the player's 1300 MB, most of the download (issue #500))
      - name: The Linux player packed
        run: |
          t0=$(date +%s)
          skip=('--exclude=*_BackUpThisFolder_ButDontShipItWithYourGame' '--exclude=*_BurstDebugInformation_DoNotShip')
          if command -v pigz > /dev/null; then tar -I pigz "${skip[@]}" -cf "$RUNNER_TEMP/hiraeth-unity-linux.tar.gz" -C "$PROJECT/Builds" bridge-linux
          else tar czf "$RUNNER_TEMP/hiraeth-unity-linux.tar.gz" "${skip[@]}" -C "$PROJECT/Builds" bridge-linux; fi
          ls -l "$RUNNER_TEMP/hiraeth-unity-linux.tar.gz"; echo "packed in $(($(date +%s) - t0)) s"
          du -sm "$PROJECT/Builds/bridge-linux"/* "$PROJECT/Builds/bridge-linux"/*_Data/* | sort -n | tail -12

      # The gate before the Steam Deck can take it (the Unity-default plan's D12): the unit suite passed on this commit
      # (tests.yml: scripts/wait-tests.sh); failing, nothing is published and the Decks keep the player they have. (A
      # smoke run of the player under Xvfb and lavapipe was removed: Unity's player refuses the runner's software Vulkan,
      # "No supported renderers found", run 38901932713; the Deck's launcher already falls back to the web on a bad build.)
      - name: The unit suite passed on this commit (tests.yml)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/wait-tests.sh "${{ github.sha }}" 90

      - name: Publish to the release unity-linux
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          scripts/unity-publish.sh linux "$RUNNER_TEMP/hiraeth-unity-linux.tar.gz" "GitHub Actions (run ${{ github.run_number }})"
