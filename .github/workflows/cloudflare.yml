name: Deploy to Cloudflare Workers

# The game's site, and its content updates next to it: /updates/web.json and
# /updates/web-<build>.zip (scripts/web-update.mjs), which the Android app
# (WebBundles.MANIFEST) and the Steam Deck updater (deck.py) read, and the Unity players' script,
# /updates/unity.json and /updates/unity-<build>.zip (BridgeUpdates.cs). This is the only
# workflow that deploys the Worker: a deploy replaces every asset. The Steam Deck runtime
# (Electron and the launcher) lives independently in R2, served at the same URLs.
#
# When: after the unit suite passed on a push to main (tests.yml, "Tests": this workflow is triggered by its
# run finishing and goes on only when that run was a push to main here and succeeded), building that run's
# commit, github.event.workflow_run.head_sha (github.sha would be main's newest commit when this run
# started). By hand (workflow_dispatch): the chosen ref only after its exact test gate succeeds.
# (By hand only from main: the Worker is production.)

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_deck_runtime:
        description: Build and publish a new Steam Deck runtime to R2 (manual only)
        type: boolean
        default: false
      migrate_deck_runtime:
        description: Copy and verify the existing runtime into R2 only; do not build or deploy the site
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  statuses: write   # (scripts/commit-status.sh: "release: web (cloudflare)" on the tested commit)

# Never cancelled once started; pushes meanwhile wait (GitHub keeps the newest one waiting).
# (Only a run that will build takes the group: one whose tests failed, or a run for another branch or event, has
# a group of its own and is skipped, so it can't replace a waiting deploy or cancel a running one.)
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)) && 'cloudflare-production' || format('cloudflare-production-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  deploy:
    # (the suite passed on a push to main in this repository, or a run by hand from main; else skipped)
    if: github.event.inputs.migrate_deck_runtime != 'true' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30   # (a new Deck runtime: Electron packaged and 150 MB uploaded and checked)
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}   # the tested commit
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0   # the whole history: the build number counts its commits (release-info.mjs build)
      # (the outcome on the tested commit, as android.yml's: pending now, success or failure at the end)
      - name: Commit status (pending)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/commit-status.sh pending "release: web (cloudflare)"
      - name: Require the selected commit's test gate for a manual deploy
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/wait-tests.sh "${{ github.sha }}"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the game and its content update
        run: |
          npm run build
          # this build's zip and web.json, and the previous build's zip from the live site
          # (a device that read the old web.json a moment ago can finish its download); and the Unity players' script over
          # the air (--unity: BridgeUpdates.cs), the script bundle and the menus' pictures as the players carry them in
          # StreamingAssets/hiraeth-js, made into that folder, then unity-<build>.zip and unity.json, the previous kept too
          node scripts/web-update.mjs --live https://hiraeth.alexandria-rnaud.workers.dev/ --unity "$RUNNER_TEMP/unity-ota"
          cat dist/updates/web.json dist/updates/unity.json
      - name: Publish a requested Steam Deck runtime to R2
        if: github.event_name == 'workflow_dispatch' && inputs.build_deck_runtime
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ vars.CLOUDFLARE_API_TOKEN_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          # Ordinary web deploys never fetch or upload the native runtime.
          WEB_BUILD=$(node scripts/release-info.mjs build)
          export WEB_BUILD
          export DECK_BUILD=$((WEB_BUILD * 1000 + GITHUB_RUN_ATTEMPT))
          node scripts/deck-runtime.mjs --build-only
          node scripts/r2-deck.mjs --from dist/updates
          # The runtime is now independent of the static asset deployment.
          rm dist/updates/steam-deck*
      - name: The changelog's pictures on the site
        run: |
          # (after the content update and the Deck's runtime are made: the pictures are the site's alone,
          # never in the APK, the update zip or the Deck; changelog.html reads them from here)
          cp -R changelog-media dist/changelog-media
          du -sh dist/changelog-media
      # the references page's pictures (scripts/references-site.mjs: the index, 360 px thumbnails and web-size
      # copies in dist/references/, ≈ 70 MB; site-only like the changelog's, never the originals): encoded once,
      # kept in the cache between runs (keyed on the pictures and the script)
      - uses: actions/cache@v4
        with:
          path: .cache/references-site
          key: references-site-${{ hashFiles('references/**', 'scripts/references-site.mjs') }}
          restore-keys: references-site-
      - name: The references' pictures on the site
        run: |
          node scripts/references-site.mjs dist
          du -sh dist/references
      - name: Deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
          # the Notes page's two Worker secrets (docs/systems/notes.md), uploaded with the deploy when set here
          HIRAETH_ISSUES_TOKEN: ${{ secrets.HIRAETH_ISSUES_TOKEN }}
          HIRAETH_NOTES_PASSWORD: ${{ secrets.HIRAETH_NOTES_PASSWORD }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in repository Actions secrets. See docs/cloudflare.md."
            exit 1
          fi
          # The Notes secrets go up with the version (--secrets-file: added to the Worker's, never deleting any), from
          # a file only this job reads, written from the environment so they never reach a command line or the log.
          # Without them the Worker keeps the secrets it has (none on a new Worker: the notebook stays closed).
          SECRETS=()
          if [ -n "$HIRAETH_ISSUES_TOKEN" ] || [ -n "$HIRAETH_NOTES_PASSWORD" ]; then
            umask 077
            node scripts/cloudflare-secrets.mjs "$RUNNER_TEMP/worker-secrets.json"
            SECRETS=(--secrets-file "$RUNNER_TEMP/worker-secrets.json")
          else
            echo "::warning::No notebook credentials are set in repository Actions secrets: the Worker keeps the secrets it has (docs/systems/notes.md)."
          fi
          # (a deploy replaces every asset: a second attempt after a transient failure is the same deploy)
          . scripts/retry.sh
          status=0
          retry npx wrangler deploy "${SECRETS[@]}" || status=$?
          rm -f "$RUNNER_TEMP/worker-secrets.json"
          exit $status
      - name: Verify the public deployment
        run: |
          # every built file, the content update included (new files can take a minute or two to reach every edge)
          for attempt in 1 2 3 4 5 6; do
            if npm run check:deployment -- https://hiraeth.alexandria-rnaud.workers.dev/; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 20; fi
          done
          exit 1
      - name: Publish verified web release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/web-publish.sh "$SHA"

      - name: Commit status (the outcome)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/commit-status.sh "${{ job.status }}" "release: web (cloudflare)"

  migrate-runtime:
    # This can run on the migration branch before the new serving routes reach main.
    # It only copies the existing verified package; it never builds a new installer or deploys a Worker.
    if: github.event_name == 'workflow_dispatch' && inputs.migrate_deck_runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test runtime storage before copying
        run: node --test --test-concurrency=2 tests/r2-runtime.test.js tests/deck-runtime.test.js
      - name: Copy the published runtime to R2 and verify it
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ vars.CLOUDFLARE_API_TOKEN_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/r2-deck.mjs --migrate
