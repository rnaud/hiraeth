name: Nightly tests

# Complete gameplay suite in the four Tests shards, plus the existing slow tool tests.
# Scheduled/manual provenance never satisfies production's successful push-main gate.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  gameplay:
    uses: ./.github/workflows/tests.yml
    with:
      full: true
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/nightly/*.test.js
      - name: Steam Deck installer and updater tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
