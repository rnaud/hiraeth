<!doctype html><html><head><meta charset="utf-8"><title>People review</title><style>
body{margin:0;background:#eee9de;font:15px system-ui;color:#242c38}header{padding:10px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}select,input,button{font:inherit}#view{display:block;width:100%;height:80vh}
</style></head><body>
<header><strong>People review</strong>
<label>World <select id="world"></select></label>
<label>Seed <input id="seed" type="number" value="1" style="width:5em"></label>
<label>View <select id="angle"><option value="front">Front</option><option value="side">Side</option><option value="threequarter">Three-quarter</option></select></label>
<label><input id="walk" type="checkbox">Walking</label>
<output id="status">Loading…</output></header>
<p style="margin:0 12px">Front row: full NPCs (Humanoid, the costume merged on the body). Back row: the same people as GPU crowd figures (crowd-shader.js). Seeded looks: kind, build, height (costumes.js dressFor).</p>
<canvas id="view"></canvas><script type="module" src="./people-review.js"></script></body></html>
