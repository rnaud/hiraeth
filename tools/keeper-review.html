<!doctype html><html><head><meta charset="utf-8"><title>Keeper · procedural animation</title><style>body{margin:0;background:#eee9de;font:14px system-ui;color:#302d2a}header{position:fixed;z-index:2;padding:12px;background:#fffdf2ed;border-radius:0 0 12px 0;max-width:680px}button,select{padding:7px;margin:3px}canvas{display:block}#status{font-size:12px;max-width:650px}</style></head><body><header><b>Cistern-Keeper · procedural animation</b><div><select id="motion"><option value="walk">Walk</option><option value="turn">Turn</option><option value="idle">Idle</option><option value="jawClosed">Jaw closed</option><option value="jawOpen">Jaw open</option><option value="sleep">Sleep</option><option value="wake">Wake</option><option value="stamp">Stamp</option><option value="sweep">Sweep</option><option value="charge">Charge</option><option value="burrow">Burrow</option><option value="spit">Spit</option><option value="open">Open mouth</option><option value="weary">Weary</option><option value="resolved">Resolved</option><option value="encounter">Encounter controller</option></select><button id="play">Pause</button><button id="step">Step</button><button id="reset">Reset</button><label>Time <input id="seek" type="number" min="0" max="30" step="0.1" value="0" style="width:55px"> s</label><button id="go">Go</button></div><div><select id="mode"><option value="ink">Game ink</option><option value="unlit">Unlit texture</option><option value="clay">Clay geometry</option><option value="lit">Neutral light</option></select><button data-angle="head">Head close-up</button><button data-angle="front">Front</button><button data-angle="side">Side</button><button data-angle="back">Back</button><button data-angle="quarter">Three-quarter</button><button id="light">Reverse light</button></div><div id="status">Loading…</div></header><script type="module" src="./keeper-review.js"></script></body></html>
