<!doctype html><html><head><meta charset="utf-8"><title>Father asset review</title>
<style>body{margin:0;background:#eee9de;font:14px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}canvas{width:100vw;height:calc(100vh - 80px);display:block}#status{padding:0 12px}</style></head><body>
<header><strong>Father review</strong><label>Asset <select id="asset"><option value="runtime">runtime bust</option><option value="full">full working rig</option></select></label><label>View <select id="angle"><option>front</option><option>quarter</option><option>side</option><option>back</option></select></label><label>Focus <select id="focus"><option>bust</option><option>body</option><option>face</option><option>hand</option><option>elbow</option></select></label><label>Surface <select id="finish"><option>unlit</option><option>matte</option><option>clay</option><option>hologram</option></select></label><label>Light <select id="light"><option>left</option><option>right</option></select></label><label>Motion <select id="motion"><option>rest</option><option>idle</option><option>talk</option></select></label><label>Hands <select id="hands"><option>auto</option><option>flat</option><option>relaxed</option><option>fist</option></select></label><label>Gaze <select id="gaze"><option>auto</option><option>center</option><option>left</option><option>right</option></select></label><label>Mouth <select id="mouth"><option>auto</option><option>closed</option><option>open</option></select></label><label><input type="checkbox" id="landmarks">face guides</label><button id="pause">Pause</button></header><div id="status">Loading…</div><canvas id="view"></canvas><script type="module" src="./father-review.js"></script></body></html>
