<!doctype html><html><head><meta charset="utf-8"><title>Traveller gait review</title><style>
body{margin:0;background:#eee9de;font:15px system-ui;color:#242c38}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit}#view{display:block;width:100%;height:65vh}#sheet img{width:100%}p{margin:8px 12px}output{min-width:100px}a{color:#23486f}
</style></head><body>
<label>Blink <input id="blink" type="range" min="0" max="1" step=".01" value="0"></label>
<label>Smile <input id="smile" type="range" min="-1" max="1" step=".01" value="0"></label><header><strong>Traveller gait review</strong><label>Motion <select id="motion"><option value="walk">Walk</option><option value="jog">Jog</option><option value="sprint">Run</option><option value="climbUp">Climb</option></select></label><label>View <select id="angle"><option value="front">Front</option><option value="side">Side</option><option value="back">Back</option><option value="threequarter">Three-quarter</option></select></label><label><input id="face" type="checkbox">Face close-up</label><button id="faceCapture">Face views</button><button id="prev">Previous frame</button><button id="next">Next frame</button><label>Frame <input id="phase" type="range" min="0" max="119" value="0"></label><output id="status">Loading…</output><label><input id="bones" type="checkbox" checked>Show joints</label><button id="play">Play</button><button id="capture">12-frame sheet</button></header><p>Actual game retargeting, sampled at 120 points per cycle. Cyan: right limbs. Coral: left limbs. Yellow: hand direction. Walking is shown before terrain foot placement; climbing includes the game’s wall-contact hand and boot orientation.</p><canvas id="view"></canvas><section id="sheet"></section><script type="module" src="./rig-review.js"></script></body></html>
