<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiraeth · Outfits gallery</title>
<!-- The outfits gallery (issue #549; src/outfits-gallery/main.js, docs/systems/characters.md "Outfits"): every
     outfit on the v2 traveller side by side, live, in the game's ink and light, standing, walking or running on
     the spot. ?motion=idle|walk|jog|sprint, ?turn=0 to hold them still, ?yaw=<radians> turned (1.57: their right
     sides to you). Dev server only: the models it loads live in data/, not in the build; the built page says so. -->
<style>
:root{color:#302936;background:#f1e6d0;font:16px/1.5 Georgia,serif}*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:14px 24px;border-bottom:1px solid #b7a98f;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
h1{font-size:21px;margin:0}a{color:inherit}
#motions{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;font-size:14px;color:inherit;border:1px solid #958875;border-radius:5px;background:#f5ecd9;padding:5px 11px;cursor:pointer}
button[aria-pressed="true"]{background:#302936;color:#f5ecd9;border-color:#302936}
label{font-size:14px}.hint{font-size:13px;font-style:italic;color:#786b63}#status{font-size:13px;color:#786b63}
main{position:relative;flex:1;min-height:0}
#stage{position:absolute;inset:0;touch-action:none;overflow:hidden}#stage canvas{width:100%;height:100%;display:block;cursor:grab}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.label{position:absolute;left:0;top:0;white-space:nowrap;font-size:14px;padding:2px 8px;background:#f8efdcd9;border:1px solid #b7a98f;border-radius:4px}
#note{position:absolute;top:16px;left:50%;transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));padding:12px 14px;background:#fff8e9;color:#7a2a20;border:1px solid #c9a99a;border-radius:6px;font-size:14px}
@media(max-width:640px){header{padding:12px 16px}h1{font-size:18px}}
</style>
</head>
<body data-debug-back>
<header>
  <h1 class="debug-room">Outfits gallery</h1>
  <div id="motions" role="group" aria-label="What they do"></div>
  <label><input type="checkbox" id="turn" checked> Turning</label>
  <span class="hint">Drag to turn them · scroll to zoom</span>
  <span id="status">Dressing the travellers…</span>
</header>
<main>
  <div id="stage" aria-label="Every outfit on the traveller, side by side"></div>
  <div id="labels"></div>
  <output id="note" hidden></output>
</main>
<script type="module" src="/src/outfits-gallery/main.js"></script>
<script type="module" src="/src/debug-back-page.js"></script>
</body>
</html>
