<!doctype html><meta charset="utf-8"><title>Grunt · three rigging trials</title>
<style>body{margin:0;background:#f4f0e5;color:#26251f;font:14px system-ui}header{padding:12px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit;padding:5px}#stage{height:72vh}canvas{display:block;width:100%;height:100%}#info{padding:8px 18px;white-space:pre-wrap;font:12px monospace}h1{font-size:18px;margin:0 18px 0 0}</style>
<header><h1>Grunt trial</h1><a href="compare.html">Compare three rigs</a><select id="asset"><option value="tripo-rigged.glb">Tripo native rig</option><option value="custom-rigged.glb">Custom anatomical rig</option><option value="source.glb">Tripo source</option><option value="rigged.glb">Meshy rigged · corrected</option><option value="rigged-v1-orientation-failed.glb">First rig · failed orientation</option></select><select id="material"><option>Textured</option><option>Unlit</option><option>Clay</option><option>Wireframe</option></select><button id="front">Front</button><button id="side">Side</button><button id="back">Back</button><button id="threeq">¾ view</button><button id="light">Reverse light</button><button id="bones">Skeleton</button><select id="pose"><option>T-pose</option><option>Arms down</option><option>Elbows bent</option><option>Knee lift</option><option>Finger curl</option></select><button id="motion">Exercise rig</button><button id="reset">Reset</button></header>
<div id="stage"></div><div id="metrics" style="padding:8px 18px"></div><div id="info">Loading… · silent viewer; no audio system · standalone prototype, not game integration.</div>
<script type="module">
import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const query=new URLSearchParams(location.search);if(query.has('asset'))document.getElementById('asset').value=query.get('asset');else document.getElementById('asset').value='rigged.glb';if(query.has('embedded')){document.querySelector('header').style.display='none';document.getElementById('stage').style.height='80vh';document.getElementById('info').style.display='none'}const $=id=>document.getElementById(id),scene=new T.Scene();scene.background=new T.Color('#f4f0e5');const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));$('stage').append(renderer.domElement);const camera=new T.PerspectiveCamera(35,1,.01,100),controls=new OrbitControls(camera,renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x777777,2));const sun=new T.DirectionalLight(0xffffff,3);sun.position.set(3,4,5);scene.add(sun);let object,helper,original=new Map(),rest=new Map(),boneList=[],mixer,clips=[],playing=false,clock=0,belly=[],metrics={};const loader=new GLTFLoader();
function view(x,z){camera.position.set(x,.75,z);controls.target.set(0,.65,0);controls.update()}function applyMaterial(){const mode=$('material').value;object?.traverse(n=>{if(!n.isMesh)return;const mats=[].concat(original.get(n));n.material=mats.map(m=>mode==='Unlit'?new T.MeshBasicMaterial({map:m.map,color:m.color,side:T.DoubleSide}):mode==='Clay'?new T.MeshStandardMaterial({color:0xb2aaa0,roughness:.9,side:T.DoubleSide}):mode==='Wireframe'?new T.MeshBasicMaterial({color:0x37474f,wireframe:true}):m);if(n.material.length===1)n.material=n.material[0]})}
function reset(){for(const[b,q]of rest)b.quaternion.copy(q);object?.updateMatrixWorld(true)}
function measure(){let sum=0,max=0;for(const item of belly){const p=item.mesh.applyBoneTransform(item.index,item.local.clone()).applyMatrix4(item.mesh.matrixWorld),d=p.distanceTo(item.world);sum+=d;max=Math.max(max,d)}metrics={sampleVertices:belly.length,meanDisplacementMm:1000*sum/Math.max(1,belly.length),maxDisplacementMm:1000*max};$('metrics').textContent=`Belly movement: ${metrics.meanDisplacementMm.toFixed(1)} mm average / ${metrics.maxDisplacementMm.toFixed(1)} mm max · ${belly.length} sampled vertices · normalized height 1.3 m`;parent.postMessage({type:'rig-metrics',asset:$('asset').value,pose:$('pose').value,...metrics},location.origin)}
function pose(amount=1){reset();const p=$('pose').value;for(const b of boneList){const name=b.name.toLowerCase();let axis=null,angle=0;if(p==='Arms down'&&(/upperarm|leftarm|rightarm|upper_arm/.test(name))&&!/fore|lower|twist/.test(name)){axis='z';angle=(/left|\.l|_l/.test(name)?-1:1)*1.05*amount}if(p==='Elbows bent'&&/forearm|lowerarm|lower_arm/.test(name)){axis='y';angle=(/left|\.l|_l/.test(name)?-1:1)*1.25*amount}if(p==='Knee lift'&&/leftupleg|leftthigh|thigh_l|leftup_leg/.test(name)){axis='x';angle=-.8*amount}if(p==='Knee lift'&&/leftleg|leftcalf|calf_l/.test(name)){axis='x';angle=1.2*amount}if(p==='Finger curl'&&/finger|thumb|index|middle|ring|pinky/.test(name)){axis=/thumb/.test(name)?'x':'y';angle=(/thumb/.test(name)?1:(/left|\.l|_l/.test(name)?-1:1))*.55*amount}if(axis){object.updateMatrixWorld(true);const a=new T.Vector3(axis==='x'?1:0,axis==='y'?1:0,axis==='z'?1:0).applyQuaternion(b.parent.getWorldQuaternion(new T.Quaternion()).invert());b.quaternion.premultiply(new T.Quaternion().setFromAxisAngle(a,angle))}}object?.updateMatrixWorld(true);measure()}
async function load(){playing=false;clock=0;if(object)scene.remove(object);if(helper)scene.remove(helper);original.clear();rest.clear();boneList=[];try{const gltf=await loader.loadAsync('./'+$('asset').value);object=gltf.scene;if(['source.glb','rigged-v1-orientation-failed.glb'].includes($('asset').value))object.rotation.y=-Math.PI/2;scene.add(object);const box=new T.Box3().setFromObject(object),size=box.getSize(new T.Vector3()),c=box.getCenter(new T.Vector3()),s=1.3/size.y;object.scale.multiplyScalar(s);object.position.set(-c.x*s,-box.min.y*s,-c.z*s);object.updateMatrixWorld(true);let verts=0,tris=0,skins=0;object.traverse(n=>{if(n.isMesh){original.set(n,n.material);verts+=n.geometry.attributes.position.count;tris+=(n.geometry.index?.count??n.geometry.attributes.position.count)/3;if(n.isSkinnedMesh)skins++}if(n.isBone){boneList.push(n);rest.set(n,n.quaternion.clone())}});helper=new T.SkeletonHelper(object);helper.visible=false;scene.add(helper);clips=gltf.animations;belly=[];object.traverse(n=>{if(!n.isSkinnedMesh)return;const ps=n.geometry.attributes.position;for(let i=0;i<ps.count;i++){const local=new T.Vector3().fromBufferAttribute(ps,i),world=n.applyBoneTransform(i,local.clone()).applyMatrix4(n.matrixWorld);if(Math.abs(world.x)<.156&&world.y>.52&&world.y<.754&&world.z>0)belly.push({mesh:n,index:i,local,world})}});measure();view(0,4);applyMaterial();$('pose').value='T-pose';$('pose').querySelector('option:last-child').disabled=!boneList.some(b=>/finger|thumb|index|middle|ring|pinky/i.test(b.name));$('info').textContent=JSON.stringify({asset:$('asset').value,vertices:verts,triangles:tris,skinnedMeshes:skins,bones:boneList.length,clips:clips.map(c=>({name:c.name,duration:c.duration})),boneNames:boneList.map(b=>b.name),sourceBounds:size.toArray(),audio:'No audio objects or media elements created',limitations:'Diagnostic joint exercises only; not retargeted game clips or final game rendering.'},null,2);parent.postMessage({type:'rig-ready'},location.origin)}catch(e){$('info').textContent=e.stack}}
$('asset').onchange=load;$('material').onchange=applyMaterial;$('front').onclick=()=>view(0,4);$('back').onclick=()=>view(0,-4);$('side').onclick=()=>view(4,0);$('threeq').onclick=()=>view(2.8,2.8);$('light').onclick=()=>sun.position.x*=-1;$('bones').onclick=()=>helper.visible=!helper.visible;$('pose').onchange=()=>{playing=false;pose()};$('reset').onclick=()=>{playing=false;$('pose').value='T-pose';reset()};$('motion').onclick=()=>{playing=!playing;clock=0};let last=performance.now();function render(now){const dt=Math.min((now-last)/1000,.05);last=now;if(playing){clock+=dt;pose((Math.sin(clock*2)+1)/2)}const w=$('stage').clientWidth,h=$('stage').clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();controls.update();renderer.render(scene,camera);requestAnimationFrame(render)}window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data;if(d.type==='pose'){playing=false;$('pose').value=d.value;pose()}if(d.type==='view')$(d.value).click();if(d.type==='material'){$('material').value=d.value;applyMaterial()}if(d.type==='bones')$('bones').click();if(d.type==='motion'){playing=d.value;clock=0}});await load();requestAnimationFrame(render);
</script>
