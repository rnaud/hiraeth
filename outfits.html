<!-- The outfits test page (issue #540; docs/systems/characters.md, "Outfits"): the game in a world (the desert

<style>body{margin:0;background:#efe6d2;color:#302b25;font:15px system-ui;display:grid;place-items:center;align-content:center;gap:8px;height:100vh}</style>

<body data-debug-back>
<h1 class="debug-room"><a href="./index.html" title="Back to the game">Hiraeth</a> · Outfits</h1>
<p id="msg">Opening the game with the outfit picker…</p>
<script type="module">
const q = new URLSearchParams(location.search);
const n = new URLSearchParams({ level: q.get('level') ?? 'desert', outfits: q.get('outfit') ?? 'default' });
location.replace(`./index.html?${n}`);
</script>
<script type="module" src="/src/debug-back-page.js"></script>
