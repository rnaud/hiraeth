<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hiraeth — the items</title>
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<style>
  /* The items, to review (src/items-page/): every item, its picture, what it does and where it is found */
  :root { --paper: #f7ecd2; --card: #fbf4e2; --ink: #2b211f; --rule: rgba(43, 33, 31, 0.25); }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  header { position: sticky; top: 0; z-index: 5; padding: 12px 18px 8px; background: var(--paper); border-bottom: 2px solid var(--ink); }
  .top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  h1 { margin: 0; font-size: 22px; letter-spacing: 0.14em; flex: 1 1 auto; }
  h1 span { font-size: 12px; letter-spacing: 0; opacity: 0.6; font-weight: normal; }
  #search { flex: 1 1 220px; min-width: 0; padding: 6px 10px; background: var(--card); border: 2px solid var(--ink); font: inherit; }
  .btn { padding: 5px 11px; background: var(--card); border: 2px solid var(--ink); color: var(--ink); text-decoration: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { padding: 2px 10px; background: var(--card); border: 1.5px solid var(--ink); border-radius: 14px; cursor: pointer; font: inherit; font-size: 12.5px; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr)); gap: 16px; padding: 18px; }
  article { display: flex; gap: 14px; padding: 12px 14px; background: var(--card); border: 2px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); }
  article[hidden] { display: none; }
  .pic { position: relative; flex: none; width: 150px; height: 150px; border: 2px solid var(--ink); background: #f3e7cc; cursor: grab; touch-action: none; }
  .pic:active { cursor: grabbing; }
  .pic img, .pic canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .pic canvas { opacity: 0; transition: opacity 0.2s; }
  .pic.drawn canvas { opacity: 1; }
  /* the full-screen view: the item live, drag to turn it, wheel or pinch to zoom */
  #full { position: fixed; inset: 0; z-index: 20; background: #f3e7cc; display: none; touch-action: none; cursor: grab; }
  #full.open { display: block; }
  #full canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #full .bar { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 8px; align-items: center; padding: 12px 16px; pointer-events: none; }
  #full .bar > * { pointer-events: auto; }
  #full .bar h2 { flex: 1; margin: 0; font-size: 20px; letter-spacing: 0.08em; }
  #full .about { position: absolute; left: 16px; bottom: 16px; max-width: min(560px, 90vw); padding: 10px 14px; background: rgba(251, 244, 226, 0.92); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); }
  #full .about p { margin: 0 0 4px; }
  #full .hint { position: absolute; right: 16px; bottom: 16px; font-size: 12px; opacity: 0.7; }
  .pic.none::after { content: '?'; font-size: 34px; opacity: 0.3; }
  .txt { min-width: 0; flex: 1; }
  h2 { margin: 0 0 2px; font-size: 16px; letter-spacing: 0.04em; }
  .meta { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #8a5a3c; margin-bottom: 6px; }
  p { margin: 0 0 6px; }
  .use { border-left: 3px solid var(--rule); padding-left: 8px; }
  .where { font-size: 12.5px; margin: 6px 0 0; padding-left: 16px; }
  .where li { margin: 2px 0; }
  .where b { font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>THE ITEMS <span id="count"></span></h1>
    <input id="search" type="search" placeholder="Search the items" aria-label="Search the items" autocomplete="off">
    <a class="btn" href="./">Play</a>
  </div>
  <div class="chips" id="kinds" role="toolbar" aria-label="What kind of item"></div>
</header>
<main id="list"></main>
<div id="full" aria-hidden="true">
  <div class="bar"><button class="btn" data-go="-1" title="The item before (←)">◀</button><h2></h2><button class="btn" data-spin title="Turn on its own (R)">turn</button><button class="btn" data-reset title="The view it opened with (double click)">reset</button><button class="btn" data-go="1" title="The item after (→)">▶</button><button class="btn" data-close title="Close (Esc)">close ✕</button></div>
  <div class="about"></div>
  <div class="hint">drag to turn · wheel or pinch to zoom · ← → the other items · Esc closes</div>
</div>
<script type="module" src="/src/items-page/main.js"></script>
</body>
</html>
